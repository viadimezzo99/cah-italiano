<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 120 96%27%3E%3Crect x=%2710%27 y=%2714%27 width=%2756%27 height=%2776%27 rx=%279%27 fill=%27%23111%27 transform=%27rotate(-10 38 52)%27/%3E%3Crect x=%2750%27 y=%2710%27 width=%2756%27 height=%2776%27 rx=%279%27 fill=%27%23fff%27 stroke=%27%23111%27 stroke-width=%273%27 transform=%27rotate(8 78 48)%27/%3E%3C/svg%3E">
<title>CAH Italiano</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Fraunces:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=Permanent+Marker&display=swap">
<style>
/* Tavolo: carta calda e inchiostro, accento arancio bruciato. Le carte da gioco restano sempre
   bianche e nere, in qualsiasi tema. */
:root {
  --bg: #ece5d6; --fg: #1c1a17; --muted: #6d655a; --line: #d6ccb9;
  --paper: #fbf8f0; --accent: #c4502a; --ok: #2f7a4d;
  --ts: 1; --cs: 1; --card-font: "Bricolage Grotesque", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14120f; --fg: #ece5d6; --muted: #a0978a; --line: #36312a;
    --paper: #2a2620; --accent: #f08a5d; --ok: #6cc08c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14120f; --fg: #ece5d6; --muted: #a0978a; --line: #36312a;
  --paper: #2a2620; --accent: #f08a5d; --ok: #6cc08c; color-scheme: dark;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; color: var(--fg);
  background:
    radial-gradient(900px 480px at 50% -12%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 62%),
    radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--fg) 7%, transparent) 1px, transparent 0) 0 0 / 18px 18px,
    var(--bg);
  font: 400 15px/1.45 "IBM Plex Sans", system-ui, sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 28px;
}
.col { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
h1, h2, .display { font-family: "Bricolage Grotesque", system-ui, sans-serif; text-wrap: balance; margin: 0; }
.label { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.hidden-msg { color: var(--muted); font-size: 14px; margin: 0; }
button {
  font: inherit; font-weight: 600; color: inherit; cursor: pointer; touch-action: manipulation;
  border: 1px solid var(--line); background: var(--paper); border-radius: 12px; padding: 11px 16px;
  transition: transform .15s, background .15s;
}
button:active:not(:disabled) { transform: scale(.97); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 8px 18px -10px var(--accent); }
button.ghost { background: transparent; }
button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
input[type="text"] { font: inherit; color: inherit; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; }
input[type="range"] { width: 100%; accent-color: var(--accent); }

/* Logo */
.logo { display: flex; align-items: center; gap: 12px; }
.logo svg { width: 64px; height: 52px; flex: 0 0 auto; }
.wordmark { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; line-height: .95; letter-spacing: -.01em; }
.wordmark span { display: block; }
.wordmark .acc { color: var(--accent); }
.wordmark i { display: block; margin-top: 8px; font-style: normal; font-size: 11px; letter-spacing: .2em; color: var(--muted); font-weight: 600; }
.logo.big svg { width: 120px; height: 96px; }
.logo.big .wordmark { font-size: 40px; }
.logo.big .wordmark i { font-size: 13px; }

/* Schermata iniziale */
.setup { display: flex; flex-direction: column; gap: 18px; padding-top: 18px; align-items: center; text-align: center; }
.setup .panel { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 10px;
  background: color-mix(in srgb, var(--paper) 80%, transparent); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.names { display: flex; flex-direction: column; gap: 8px; }
.names .nrow { display: flex; gap: 8px; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }

/* Tavolo */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.topbar .logo { gap: 8px; }
.topbar .logo svg { width: 36px; height: 30px; }
.topbar .wordmark { font-size: 15px; }
.topbar .wordmark i { display: none; }
.topbar .tools { display: flex; gap: 6px; }
.topbar .tools button { padding: 8px 12px; }
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
.seat {
  padding: 8px 10px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line);
  transition: transform .3s cubic-bezier(.2,.9,.3,1.3), border-color .3s, box-shadow .3s;
}
.seat.judge { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 10px 18px -12px var(--accent); }
.seat.won { animation: pop .6s cubic-bezier(.2,.9,.3,1.4); border-color: var(--ok); }
.seat .name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seat .pts { font-family: "Bricolage Grotesque", sans-serif; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.seat .tag { font-size: 11px; color: var(--muted); }
.seat.played .tag::after { content: " · pronto"; color: var(--ok); }
.status { font-size: 14px; color: var(--muted); }
.status strong { color: var(--fg); }
.roundline { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: nowrap; }
.roundline .status { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Carta nera */
.black-wrap { display: flex; justify-content: center; perspective: 900px; }
.black {
  width: min(100%, calc(300px * var(--cs))); aspect-ratio: 5 / 7; background: #111; color: #fff;
  border-radius: 16px; padding: 20px 18px; display: flex; flex-direction: column; justify-content: space-between;
  box-shadow: 0 14px 30px -14px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.04);
  font-family: var(--card-font); font-size: calc(20px * var(--ts) * var(--cs)); line-height: 1.32; font-weight: 500;
  overflow: hidden; position: relative;
}
.black::after { /* grana da carta */
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .07; border-radius: inherit;
  background-image: radial-gradient(#fff 0.6px, transparent 0.7px); background-size: 4px 4px;
}
.black .text { text-wrap: pretty; overflow-wrap: anywhere; position: relative; z-index: 1; }
.black .foot { font-size: 11px; font-family: "IBM Plex Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; opacity: .6; position: relative; z-index: 1; }
.slot {
  display: inline-block; min-width: 3.6em; border-bottom: 2px dashed color-mix(in srgb, var(--accent) 80%, transparent);
  color: transparent; padding: 0 3px;
}
.slot.lit { animation: pulse 1.6s ease-in-out infinite; border-bottom-style: solid; border-color: var(--accent); }
.word { display: inline-block; color: inherit; animation: pop .45s cubic-bezier(.2,.9,.3,1.5); }
@keyframes pulse { 0%,100% { background: transparent; } 50% { background: color-mix(in srgb, var(--accent) 26%, transparent); } }
@keyframes pop { 0% { transform: scale(.3) rotate(-12deg); opacity: 0; } 70% { transform: scale(1.12) rotate(2deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }
@keyframes slam { from { transform: translateY(-12px); opacity: 0; } to { transform: none; opacity: 1; } }
.black.slam { animation: slam .25s ease-out; }

/* Carte bianche: sempre bianche con scritta nera. */
.rail { display: flex; gap: 12px; overflow-x: auto; padding: 16px 8px 12px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
.rail > * { flex: 0 0 auto; scroll-snap-align: center; }
.card {
  position: relative; width: calc(138px * var(--cs)); aspect-ratio: 5 / 7; display: flex; align-items: flex-end;
  text-align: left; font-family: var(--card-font); font-weight: 600; font-size: calc(14px * var(--ts) * var(--cs)); line-height: 1.3; color: #111;
  background: #fff; border: 1px solid #d6d0c2; border-radius: 12px; padding: 12px 12px 14px;
  box-shadow: 0 8px 18px -10px rgba(0,0,0,.45); overflow: hidden; overflow-wrap: anywhere;
  transition: transform .25s cubic-bezier(.2,.9,.3,1.3), box-shadow .25s, border-color .25s;
}
.rail .card { transform: none; }
.rail .card:hover:not(:disabled), .rail .card:active:not(:disabled) { transform: none; }
.rail .card.sel { transform: translateY(-16px) rotate(0deg) scale(1.03); }
.card:hover:not(:disabled) { transform: translateY(-6px) rotate(0deg); }
.card:disabled { opacity: .5; cursor: default; }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 16px 26px -14px rgba(0,0,0,.55); transform: translateY(-16px) rotate(0deg) scale(1.03); }
.card .num {
  position: absolute; left: 8px; top: 8px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff;
  display: none; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; animation: pop .35s cubic-bezier(.2,.9,.3,1.5);
}
.card.sel .num { display: flex; }
.card.deal { animation: deal .5s cubic-bezier(.2,.9,.3,1.1) both; animation-delay: calc(var(--i, 0) * 70ms); }
@keyframes deal { from { transform: translate(-30vw, -60px) rotate(-18deg) scale(.6); opacity: 0; } to { opacity: 1; } }

/* Risposte del Re: sfogliatura e confronto */
.judge-nav { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.minis { display: grid; grid-template-columns: repeat(auto-fit, minmax(calc(150px * var(--cs)), 1fr)); gap: 12px; }
.mini {
  aspect-ratio: 5 / 7; background: #111; color: #fff; border: 2px solid transparent; border-radius: 14px; padding: 14px;
  text-align: left; font-family: var(--card-font); font-size: calc(16px * var(--ts) * var(--cs)); line-height: 1.32; font-weight: 500;
  overflow: hidden; overflow-wrap: anywhere; box-shadow: 0 10px 20px -12px rgba(0,0,0,.55);
  display: flex; flex-direction: column; justify-content: space-between;
}
.mini.enter { animation: flip .55s cubic-bezier(.2,.9,.3,1.1) both; animation-delay: calc(var(--i, 0) * 120ms); }
.mini.sel { border-color: var(--accent); }
.mini .foot { font-family: "IBM Plex Sans", sans-serif; font-size: 11px; opacity: .6; }
@keyframes flip { from { transform: rotateY(90deg) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }

/* Banner e messaggi */
.banner { padding: 16px; border-radius: 16px; background: var(--paper); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.banner.win { border-color: var(--ok); }
.actions { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

/* Passaggio del telefono: stessa impostazione dell'apertura */
.curtain { position: fixed; inset: 0; z-index: 50; background: #000; overflow: hidden; cursor: pointer; }
.curtain .iw { position: absolute; left: 26px; top: 36%; color: #fff; font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 800; font-size: clamp(44px, 15vw, 76px); line-height: .95; letter-spacing: -.02em; text-align: left; white-space: nowrap; }
.curtain .iw > span { display: block; }
.curtain .cur-slot { position: relative; height: .95em; }
.curtain .cur-gap { position: absolute; left: 0; top: .04em; height: .9em; width: 4.2em; border-radius: .08em; background: rgba(255,122,61,.22); border-bottom: .07em solid #ff7a3d;
  animation: gap-out .25s ease .9s forwards; }
.curtain .cur-name { position: absolute; left: 0; top: 0; color: #ff7a3d; opacity: 0; animation: acc-in .42s ease-out .9s forwards; }
.curtain .cur-sub { margin-top: .6em; font-size: clamp(15px, 4.5vw, 18px); font-weight: 400; letter-spacing: 0; color: rgba(255,255,255,.6); white-space: normal; max-width: 16em; opacity: 0; animation: fade .4s ease 1.4s forwards; }
@keyframes gap-out { to { opacity: 0; } }
@keyframes acc-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
#app.still * { animation: none !important; transition: none !important; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* Impostazioni */
.sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s both; }
.spell-hints { display: flex; flex-wrap: wrap; gap: 6px; min-height: 0; }
.spell-hints:empty { display: none; }
.spell-hints .chip { font: inherit; font-size: 14px; padding: 4px 11px; border-radius: 999px; border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer; }
.spell-hints .chip.fix { font-style: italic; opacity: .85; }
.card-preview { margin: 8px 0; padding: 12px 14px; border-radius: 12px; background: #111; color: #fff; font-size: 17px; line-height: 1.35; min-height: 3em; }
.card-preview[hidden] { display: none; }
.sheet {
  width: 100%; max-width: 640px; max-height: 88vh; overflow: auto; background: var(--bg); color: var(--fg);
  border-radius: 22px 22px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px;
  animation: slide .35s cubic-bezier(.2,.9,.3,1.1) both; box-shadow: 0 -20px 40px -20px rgba(0,0,0,.5);
}
@keyframes slide { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet .group { display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
.sheet .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sheet .fonts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.sheet .fonts button { font-family: var(--f); font-size: 16px; text-align: left; }
.toggle { min-width: 64px; }

/* Coriandoli */
.logo img.logo-icon { width: 64px; height: 64px; border-radius: 14px; flex: 0 0 auto; }
.logo.big img.logo-icon { width: 120px; height: 120px; border-radius: 26px; }
.topbar .logo img.logo-icon { width: 36px; height: 36px; border-radius: 9px; }
@keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--rot)); opacity: .9; } }

/* Preferenza: movimento ridotto */
body.no-motion *, body.no-motion *::before, body.no-motion *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  body:not(.motion-on) *, body:not(.motion-on) *::before, body:not(.motion-on) *::after { animation: none !important; transition: none !important; }
}

/* ===== Ridisegno: partita a tutto schermo, senza scorrimento della pagina ===== */
#app:has(.game) { max-width: none; height: calc(100dvh - 44px); }
body:has(.game) { overflow: hidden; }
.game { height: 100%; min-height: 0; width: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; --ch: clamp(120px, 19dvh, 170px); }
.hud { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.hud .topbar .wordmark { font-size: 15px; }
.board { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 1px 4px; }
.board::-webkit-scrollbar { display: none; }
.seat { flex: 0 0 auto; min-width: 96px; display: grid; grid-template-columns: 1fr auto; column-gap: 8px; align-items: center; padding: 7px 10px; border-radius: 12px; }
.seat .name { grid-column: 1; }
.seat .tag { grid-column: 1; font-size: 10.5px; }
.seat .pts { grid-column: 2; grid-row: 1 / span 2; font-size: 24px; line-height: 1; }
.roundline { font-size: 13px; }

.stage { min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; overflow: hidden; }
.stage .black-wrap { flex: 1 1 auto; min-height: 0; width: 100%; align-items: center; container-type: size; }
.stage .black { width: min(100cqw, 100cqh * 5 / 7); height: auto; aspect-ratio: 5 / 7; padding: 18px 16px;
  font-size: calc(clamp(15px, 3.1dvh, 24px) * var(--ts) * var(--cs)); }
.stage > .hidden-msg { text-align: center; font-size: 13px; }
.stage .banner { flex-direction: row; align-items: center; justify-content: space-between; width: 100%; padding: 10px 14px; }
.stage .minis { width: 100%; overflow: auto; max-height: 100%; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }

.dock { min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.dock .actions { flex: 0 0 auto; justify-content: flex-end; }
.dock .actions button.primary { width: auto; padding: 6px 12px; font-size: 13px; }
*, *::before, *::after { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
input, textarea { -webkit-user-select: text; user-select: text; }
::selection { background: transparent; }
.dock .judge-nav { flex: 0 0 auto; }
.dock > .col { gap: 4px; min-height: 0; flex: 1 1 auto; }
.dock .rail { flex: 1 1 auto; min-height: 0; align-items: flex-end; padding: 14px 6px 8px; gap: 10px; }
.rail .card { width: calc(var(--ch) * 5 / 7); height: var(--ch); aspect-ratio: auto;
  font-size: calc(var(--ch) * 0.09 * var(--ts) * var(--cs)); line-height: 1.22; padding: 9px 9px 10px; border-radius: 10px; }
.rail .card .txt { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.rail .card .num { width: 22px; height: 22px; font-size: 12px; }
.card .num { position: absolute; top: 6px; right: 6px; }

/* Ingrandimento di una carta tenuta premuta */
.zoom-bg { position: fixed; inset: 0; z-index: 60; background: rgba(10,8,6,.72); display: flex; align-items: center; justify-content: center; padding: 24px; animation: fade .2s both; }
.zoom { height: min(74dvh, calc((100vw - 48px) * 7 / 5)); aspect-ratio: 5 / 7; background: #fff; color: #111; border-radius: 18px; padding: 22px 20px;
  display: flex; align-items: flex-end; box-shadow: 0 30px 60px -20px rgba(0,0,0,.6); animation: pop .35s cubic-bezier(.2,.9,.3,1.3) both; }
.zoom .txt { font-family: var(--card-font); font-weight: 700; font-size: clamp(20px, 4.4dvh, 34px); line-height: 1.22; overflow-wrap: anywhere; }

/* Orizzontale: tavolo a sinistra, mano a destra in una griglia che scorre da sola */
@media (orientation: landscape) and (max-height: 640px) {
  .game { grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr) minmax(250px, 40%); column-gap: 14px; --ch: 40dvh; }
  .hud { grid-column: 1 / -1; grid-row: 1; }
  .stage { grid-column: 1; grid-row: 2; }
  .dock { grid-column: 2; grid-row: 2; }
  .dock .rail { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); overflow-y: auto; overflow-x: hidden; align-content: start; flex-direction: initial; padding: 12px 4px 6px; gap: 10px; }
  .rail .card { width: 100%; height: auto; aspect-ratio: 5 / 7; font-size: calc(clamp(10px, 2.3dvh, 14px) * var(--ts) * var(--cs)); }
  .rail .card .txt { -webkit-line-clamp: 7; }
  .rail .card .num { width: 20px; height: 20px; font-size: 11px; }
  .stage .black { padding: 14px 12px; }
  .stage .black-wrap { container-type: size; }
  .board { padding-bottom: 0; }
  .seat { padding: 5px 9px; min-width: 88px; }
  .seat .pts { font-size: 20px; }
  .roundline { font-size: 12px; }
}

/* Home: poster, due modalità, pannello sotto */
.hero { position: relative; overflow: hidden; width: 100%; border-radius: 26px; padding: 22px 18px 20px; background: var(--fg); color: var(--bg);
  display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.hero::before { content: ""; position: absolute; left: -90px; bottom: -130px; width: 240px; height: 240px; border-radius: 50%; background: var(--accent); opacity: .85; }
.hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .09;
  background-image: radial-gradient(#fff 1px, transparent 1.2px); background-size: 9px 9px; }
.hero > * { position: relative; z-index: 1; }
.hero .wordmark { color: var(--bg); }
.hero .wordmark .acc { color: var(--accent); }
.hero .wordmark i { color: var(--bg); opacity: .65; }
.tagline { margin: 0; font-size: 14px; opacity: .8; max-width: 320px; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.mode { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 14px 14px; border-radius: 18px; text-align: left; }
.mode strong { font-family: "Bricolage Grotesque", sans-serif; font-size: 17px; font-weight: 800; }
.mode .sub { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.mode[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 10px 22px -12px var(--accent); }
.mode[aria-pressed="true"] .sub { color: rgba(255,255,255,.85); }
.mode[aria-pressed="false"] { background: var(--paper); }
.setup .panel { border-radius: 22px; padding: 18px; }
