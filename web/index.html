<title>CAH Italiano</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Fraunces:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=Permanent+Marker&display=swap">
<style>
/* Tavolo: carta calda e inchiostro, accento arancio bruciato. Le carte da gioco restano sempre
   bianche e nere, in qualsiasi tema. */
:root {
  --bg: #ece5d6; --fg: #1c1a17; --muted: #6d655a; --line: #d6ccb9;
  --paper: #fbf8f0; --accent: #c4502a; --ok: #2f7a4d;
  --ts: 1; --cs: 1; --card-font: "Bricolage Grotesque", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14120f; --fg: #ece5d6; --muted: #a0978a; --line: #36312a;
    --paper: #2a2620; --accent: #f08a5d; --ok: #6cc08c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14120f; --fg: #ece5d6; --muted: #a0978a; --line: #36312a;
  --paper: #2a2620; --accent: #f08a5d; --ok: #6cc08c; color-scheme: dark;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; color: var(--fg);
  background:
    radial-gradient(900px 480px at 50% -12%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 62%),
    radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--fg) 7%, transparent) 1px, transparent 0) 0 0 / 18px 18px,
    var(--bg);
  font: 400 15px/1.45 "IBM Plex Sans", system-ui, sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 28px;
}
.col { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
h1, h2, .display { font-family: "Bricolage Grotesque", system-ui, sans-serif; text-wrap: balance; margin: 0; }
.label { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.hidden-msg { color: var(--muted); font-size: 14px; margin: 0; }
button {
  font: inherit; font-weight: 600; color: inherit; cursor: pointer; touch-action: manipulation;
  border: 1px solid var(--line); background: var(--paper); border-radius: 12px; padding: 11px 16px;
  transition: transform .15s, background .15s;
}
button:active:not(:disabled) { transform: scale(.97); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 8px 18px -10px var(--accent); }
button.ghost { background: transparent; }
button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
input[type="text"] { font: inherit; color: inherit; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; }
input[type="range"] { width: 100%; accent-color: var(--accent); }

/* Logo */
.logo { display: flex; align-items: center; gap: 12px; }
.logo svg { width: 64px; height: 52px; flex: 0 0 auto; }
.wordmark { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; line-height: .95; letter-spacing: -.01em; }
.wordmark span { display: block; }
.wordmark .acc { color: var(--accent); }
.wordmark i { display: block; margin-top: 8px; font-style: normal; font-size: 11px; letter-spacing: .2em; color: var(--muted); font-weight: 600; }
.logo.big svg { width: 120px; height: 96px; }
.logo.big .wordmark { font-size: 40px; }
.logo.big .wordmark i { font-size: 13px; }

/* Schermata iniziale */
.setup { display: flex; flex-direction: column; gap: 18px; padding-top: 18px; align-items: center; text-align: center; }
.setup .panel { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 10px;
  background: color-mix(in srgb, var(--paper) 80%, transparent); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.names { display: flex; flex-direction: column; gap: 8px; }
.names .nrow { display: flex; gap: 8px; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }

/* Tavolo */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.topbar .logo { gap: 8px; }
.topbar .logo svg { width: 36px; height: 30px; }
.topbar .wordmark { font-size: 15px; }
.topbar .wordmark i { display: none; }
.topbar .tools { display: flex; gap: 6px; }
.topbar .tools button { padding: 8px 12px; }
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
.seat {
  padding: 8px 10px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line);
  transition: transform .3s cubic-bezier(.2,.9,.3,1.3), border-color .3s, box-shadow .3s;
}
.seat.judge { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 10px 18px -12px var(--accent); }
.seat.won { animation: pop .6s cubic-bezier(.2,.9,.3,1.4); border-color: var(--ok); }
.seat .name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seat .pts { font-family: "Bricolage Grotesque", sans-serif; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }

.seat.played .tag::after { content: " · pronto"; color: var(--ok); }
.status { font-size: 14px; color: var(--muted); }

/* Carta nera */
.black-wrap { display: flex; justify-content: center; perspective: 900px; }
.black {
  width: min(100%, calc(300px * var(--cs))); aspect-ratio: 5 / 7; background: #111; color: #fff;
  border-radius: 16px; padding: 20px 18px; display: flex; flex-direction: column; justify-content: space-between;
  box-shadow: 0 14px 30px -14px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.04);
  font-family: var(--card-font); font-size: calc(20px * var(--ts) * var(--cs)); line-height: 1.32; font-weight: 500;
  overflow: hidden; position: relative;
}
.black::after { /* grana da carta */
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .07; border-radius: inherit;
  background-image: radial-gradient(#fff 0.6px, transparent 0.7px); background-size: 4px 4px;
}
.black .text { text-wrap: pretty; overflow-wrap: anywhere; position: relative; z-index: 1; }
.black .foot { font-size: 11px; font-family: "IBM Plex Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; opacity: .6; position: relative; z-index: 1; }
.slot {
  display: inline-block; min-width: 3.6em; border-bottom: 2px dashed color-mix(in srgb, var(--accent) 80%, transparent);
  color: transparent; padding: 0 3px;
}
.slot.lit { animation: pulse 1.6s ease-in-out infinite; border-bottom-style: solid; border-color: var(--accent); }
.word { display: inline-block; color: inherit; animation: pop .45s cubic-bezier(.2,.9,.3,1.5); }
@keyframes pulse { 0%,100% { background: transparent; } 50% { background: color-mix(in srgb, var(--accent) 26%, transparent); } }
@keyframes pop { 0% { transform: scale(.3) rotate(-12deg); opacity: 0; } 70% { transform: scale(1.12) rotate(2deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }
@keyframes slam { 0% { transform: translateY(-40px) rotate(-4deg) scale(1.06); opacity: 0; } 60% { transform: translateY(6px) rotate(1deg); opacity: 1; } 100% { transform: none; } }
.black.slam { animation: slam .55s cubic-bezier(.2,.9,.3,1.2); }

/* Carte bianche: sempre bianche con scritta nera. */
.rail { display: flex; gap: 12px; overflow-x: auto; padding: 16px 8px 12px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
.rail > * { flex: 0 0 auto; scroll-snap-align: center; }
.card {
  position: relative; width: calc(138px * var(--cs)); aspect-ratio: 5 / 7; display: flex; align-items: flex-end;
  text-align: left; font-family: var(--card-font); font-weight: 600; font-size: calc(14px * var(--ts) * var(--cs)); line-height: 1.3; color: #111;
  background: #fff; border: 1px solid #d6d0c2; border-radius: 12px; padding: 12px 12px 14px;
  box-shadow: 0 8px 18px -10px rgba(0,0,0,.45); overflow: hidden; overflow-wrap: anywhere;
  transition: transform .25s cubic-bezier(.2,.9,.3,1.3), box-shadow .25s, border-color .25s;
}
.rail .card:nth-child(odd) { --tilt: -1.2deg; }
.rail .card:nth-child(even) { --tilt: 1deg; }
.rail .card { transform: rotate(var(--tilt, 0deg)); }
.card:hover:not(:disabled) { transform: translateY(-6px) rotate(0deg); }
.card:disabled { opacity: .5; cursor: default; }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 16px 26px -14px rgba(0,0,0,.55); transform: translateY(-16px) rotate(0deg) scale(1.03); }
.card .num {
  position: absolute; left: 8px; top: 8px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff;
  display: none; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; animation: pop .35s cubic-bezier(.2,.9,.3,1.5);
}
.card.sel .num { display: flex; }
.card.deal { animation: deal .5s cubic-bezier(.2,.9,.3,1.1) both; animation-delay: calc(var(--i, 0) * 70ms); }
@keyframes deal { from { transform: translate(-30vw, -60px) rotate(-18deg) scale(.6); opacity: 0; } to { opacity: 1; } }

/* Risposte del Re: sfogliatura e confronto */
.judge-nav { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.minis { display: grid; grid-template-columns: repeat(auto-fit, minmax(calc(150px * var(--cs)), 1fr)); gap: 12px; }
.mini {
  aspect-ratio: 5 / 7; background: #111; color: #fff; border: 2px solid transparent; border-radius: 14px; padding: 14px;
  text-align: left; font-family: var(--card-font); font-size: calc(16px * var(--ts) * var(--cs)); line-height: 1.32; font-weight: 500;
  overflow: hidden; overflow-wrap: anywhere; box-shadow: 0 10px 20px -12px rgba(0,0,0,.55);
  display: flex; flex-direction: column; justify-content: space-between;
}
.mini.enter { animation: flip .55s cubic-bezier(.2,.9,.3,1.1) both; animation-delay: calc(var(--i, 0) * 120ms); }
.mini.sel { border-color: var(--accent); }
.mini .foot { font-family: "IBM Plex Sans", sans-serif; font-size: 11px; opacity: .6; }
@keyframes flip { from { transform: rotateY(90deg) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }

/* Banner e messaggi */
.banner { padding: 16px; border-radius: 16px; background: var(--paper); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.banner.win { border-color: var(--ok); }
.actions { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

/* Passaggio del telefono */
.curtain {
  position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; text-align: center;
  background: color-mix(in srgb, var(--bg) 88%, #000 12%); backdrop-filter: blur(10px);
  padding: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) 24px max(24px, env(safe-area-inset-left, 0px));
  animation: fade .3s ease both;
}
.curtain .box { display: flex; flex-direction: column; gap: 18px; align-items: center; max-width: 360px; }
.curtain .big { font-family: "Permanent Marker", cursive; font-size: 34px; line-height: 1.1; transform: rotate(-3deg); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* Impostazioni */
.sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s both; }
.sheet {
  width: 100%; max-width: 640px; max-height: 88vh; overflow: auto; background: var(--bg); color: var(--fg);
  border-radius: 22px 22px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px;
  animation: slide .35s cubic-bezier(.2,.9,.3,1.1) both; box-shadow: 0 -20px 40px -20px rgba(0,0,0,.5);
}
@keyframes slide { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet .group { display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
.sheet .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sheet .fonts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.sheet .fonts button { font-family: var(--f); font-size: 16px; text-align: left; }
.toggle { min-width: 64px; }

/* Coriandoli */
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 30; }
.confetti i { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 2px; animation: fall 2.4s cubic-bezier(.3,.1,.6,1) forwards; }
@keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--rot)); opacity: .9; } }

/* Preferenza: movimento ridotto */
body.no-motion *, body.no-motion *::before, body.no-motion *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  body:not(.motion-on) *, body:not(.motion-on) *::before, body:not(.motion-on) *::after { animation: none !important; transition: none !important; }
}

<script type="module">
// Motore delle regole di Cards Against Humanity (versione italiana).
// Nessuna dipendenza esterna: gira identico nel server Node e nel client.
// Ogni mutazione restituisce una lista di eventi, utile per animare la UI.

export const DEFAULTS = {
  handSize: 10,
  winScore: 8, // le regole non fissano una fine: è un'opzione della stanza
};

// Generatore pseudo-casuale deterministico (mulberry32) per test ripetibili.
export function seededRng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

export function shuffle(items, rng = Math.random) {
  const a = items.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Divide il testo di una carta nera in segmenti, per disegnare gli spazi.
export function segments(text) {
  return text.split("____").flatMap((part, i, arr) => {
    const out = [{ type: "text", value: part }];
    if (i < arr.length - 1) out.push({ type: "blank", index: i });
    return out;
  });
}

export class Game {
  /**
   * @param {{id:string,name:string,isBot?:boolean}[]} players
   * @param {{white:{id:string,text:string}[], black:{id:string,text:string,blanks:number}[]}} cards
   * @param {{handSize?:number, winScore?:number|null, rng?:() => number}} options
   */
  constructor(players, cards, options = {}) {
    if (players.length < 3) throw new Error("Servono almeno 3 giocatori");
    const ids = new Set(players.map((p) => p.id));
    if (ids.size !== players.length) throw new Error("ID giocatori duplicati");

    this.opts = { ...DEFAULTS, ...options };
    this.rng = this.opts.rng ?? Math.random;
    this.cardText = new Map([...cards.white, ...cards.black].map((c) => [c.id, c.text]));
    this.whiteById = new Map(cards.white.map((c) => [c.id, c]));
    this.blackById = new Map(cards.black.map((c) => [c.id, c]));

    this.players = players.map((p) => ({
      id: p.id,
      name: p.name,
      isBot: !!p.isBot,
      hand: [],
      score: 0,
    }));
    this.deck = shuffle(cards.white.map((c) => c.id), this.rng);
    this.discard = [];
    this.blackDeck = shuffle(cards.black.map((c) => c.id), this.rng);
    this.blackDiscard = [];

    this.phase = "lobby"; // lobby | playing | judging | roundEnd | over
    this.round = 0;
    this.judgeIndex = -1;
    this.currentBlack = null;
    this.submissions = new Map(); // playerId -> cardIds
    this.revealOrder = []; // playerIds in ordine mischiato per il giudice
    this.lastWinner = null;
    this.winner = null;
  }

  // ---------------------------------------------------------------- mazzi

  draw() {
    if (this.deck.length === 0) {
      this.deck = shuffle(this.discard, this.rng);
      this.discard = [];
    }
    return this.deck.pop() ?? null;
  }

  drawBlack() {
    if (this.blackDeck.length === 0) {
      this.blackDeck = shuffle(this.blackDiscard, this.rng);
      this.blackDiscard = [];
    }
    return this.blackDeck.pop() ?? null;
  }

  text(cardId) {
    return this.cardText.get(cardId);
  }

  get judge() {
    return this.judgeIndex >= 0 ? this.players[this.judgeIndex] : null;
  }

  player(id) {
    const p = this.players.find((x) => x.id === id);
    if (!p) throw new Error(`Giocatore sconosciuto: ${id}`);
    return p;
  }

  // ---------------------------------------------------------------- partita

  start() {
    if (this.phase !== "lobby") throw new Error("La partita è già iniziata");
    const events = [];
    for (const p of this.players) {
      this.fill(p, events);
    }
    this.judgeIndex = Math.floor(this.rng() * this.players.length);
    this.beginRound(events);
    return events;
  }

  fill(player, events) {
    while (player.hand.length < this.opts.handSize) {
      const id = this.draw();
      if (id === null) break;
      player.hand.push(id);
      events.push({ type: "draw", playerId: player.id, cardId: id });
    }
  }

  beginRound(events) {
    if (this.currentBlack) this.blackDiscard.push(this.currentBlack.id);
    this.currentBlack = this.blackById.get(this.drawBlack());
    this.round += 1;
    this.submissions = new Map();
    this.revealOrder = [];
    this.phase = "playing";
    events.push({ type: "round", round: this.round, judgeId: this.judge.id, blackId: this.currentBlack.id });
  }

  /** Il giocatore invia le carte bianche per completare la nera. */
  play(playerId, cardIds) {
    if (this.phase !== "playing") throw new Error("Non è il momento di giocare");
    const p = this.player(playerId);
    if (p.id === this.judge.id) throw new Error("Il Re delle Carte non gioca carte bianche");
    if (this.submissions.has(playerId)) throw new Error("Hai già giocato");
    const need = this.currentBlack.blanks;
    if (cardIds.length !== need) throw new Error(`Servono ${need} carte`);
    if (new Set(cardIds).size !== cardIds.length) throw new Error("Carte duplicate");
    for (const id of cardIds) {
      if (!p.hand.includes(id)) throw new Error("Carta non in mano");
    }

    const events = [];
    for (const id of cardIds) {
      p.hand.splice(p.hand.indexOf(id), 1);
      this.discard.push(id);
    }
    this.submissions.set(playerId, cardIds.slice());
    events.push({ type: "played", playerId, cardIds: cardIds.slice() });

    const expected = this.players.length - 1;
    if (this.submissions.size === expected) {
      this.phase = "judging";
      this.revealOrder = shuffle([...this.submissions.keys()], this.rng);
      events.push({ type: "judging", count: this.revealOrder.length });
    }
    return events;
  }

  /** Versione per il giudice: le risposte senza nome. */
  reveal() {
    if (this.phase !== "judging") return [];
    return this.revealOrder.map((playerId, index) => ({
      index,
      cards: this.submissions.get(playerId).map((id) => ({ id, text: this.text(id) })),
    }));
  }

  /** Il Re sceglie la risposta preferita. */
  pick(judgeId, index) {
    if (this.phase !== "judging") throw new Error("Non ci sono risposte da giudicare");
    if (judgeId !== this.judge.id) throw new Error("Solo il Re può scegliere");
    if (!Number.isInteger(index) || index < 0 || index >= this.revealOrder.length) {
      throw new Error("Scelta non valida");
    }
    const winnerId = this.revealOrder[index];
    const winner = this.player(winnerId);
    winner.score += 1;
    this.lastWinner = winnerId;
    this.phase = "roundEnd";

    const events = [{ type: "picked", winnerId, index, blackId: this.currentBlack.id }];
    const turnEnd = this.checkWinner();
    if (turnEnd) events.push(turnEnd);
    return events;
  }

  checkWinner() {
    if (this.opts.winScore == null) return null;
    const top = this.players.reduce((a, b) => (b.score > a.score ? b : a));
    if (top.score >= this.opts.winScore) {
      this.winner = top.id;
      this.phase = "over";
      return { type: "gameOver", winnerId: top.id, score: top.score };
    }
    return null;
  }

  /** Dopo la scelta: rimette in mano le carte, passa il Re, apre la nuova nera. */
  nextRound() {
    if (this.phase !== "roundEnd") throw new Error("Il round non è ancora concluso");
    const events = [];
    this.judgeIndex = (this.judgeIndex + 1) % this.players.length;
    for (const p of this.players) this.fill(p, events);
    this.beginRound(events);
    return events;
  }

  // ------------------------------------------------ fallback per timeout / bot

  /** Gioca per conto di un giocatore: carte casuali, nell'ordine di pesca. */
  autoPlay(playerId) {
    const p = this.player(playerId);
    const n = this.currentBlack.blanks;
    const picks = shuffle(p.hand, this.rng).slice(0, n);
    return this.play(playerId, picks);
  }

  /** Il giudice non sceglie in tempo: viene scelta una risposta a caso. */
  autoPick() {
    const index = Math.floor(this.rng() * this.revealOrder.length);
    return this.pick(this.judge.id, index);
  }

  /** Gioca per tutti i bot che devono ancora rispondere. */
  playBots() {
    const events = [];
    if (this.phase !== "playing") return events;
    for (const p of this.players) {
      if (!p.isBot || p.id === this.judge.id || this.submissions.has(p.id)) continue;
      events.push(...this.autoPlay(p.id));
      if (this.phase !== "playing") break;
    }
    return events;
  }

  /** Se il giudice è un bot, sceglie per lui. */
  judgeIfBot() {
    if (this.phase === "judging" && this.judge.isBot) return this.autoPick();
    return [];
  }

  /** Stato pubblico: nessuna carta coperta visibile a nessun altro giocatore. */
  publicState(forPlayerId) {
    return {
      phase: this.phase,
      round: this.round,
      judgeId: this.judge?.id ?? null,
      black: this.currentBlack ? { id: this.currentBlack.id, text: this.currentBlack.text, blanks: this.currentBlack.blanks } : null,
      players: this.players.map((p) => ({
        id: p.id,
        name: p.name,
        score: p.score,
        isBot: p.isBot,
        handSize: p.hand.length,
        hasPlayed: this.submissions.has(p.id),
        hand: p.id === forPlayerId ? p.hand.map((id) => ({ id, text: this.text(id) })) : undefined,
      })),
      reveal: this.reveal(),
      winner: this.winner,
    };
  }
}

// Anteprima della frase: inserisce la carta bianca nello spazio e aggiusta
// articoli e preposizioni articolate in base a genere e numero della risposta.
// Euristica per l'italiano: non è un parser. Dove non è sicura, lascia il testo com'è.

const VOWEL = /^[aeiouàèéìòù]/i;
// Parole che richiedono "lo/uno/gli" davanti (s+consonante, z, gn, ps, x, y, i+vocale).
const IMPURE = /^(s[^aeiouàèéìòù\s]|z|gn|ps|x|y|i[aeouàèéìòù])/i;
const SINGULAR_IN_I = new Set(["analisi", "crisi", "tesi", "ipotesi", "sintesi", "noi"]);

const ART = {
  il: { g: "m", n: "s" }, lo: { g: "m", n: "s" }, "l'": { g: "m", n: "s" }, la: { g: "f", n: "s" },
  i: { g: "m", n: "p" }, gli: { g: "m", n: "p" }, le: { g: "f", n: "p" },
  un: { g: "m", n: "s" }, uno: { g: "m", n: "s" }, "un'": { g: "f", n: "s" }, una: { g: "f", n: "s" },
};

// Preposizioni articolate: [preposizione, articolo] -> forma unita.
const CONTRACT = {
  di: { il: "del", lo: "dello", "l'": "dell'", la: "della", i: "dei", gli: "degli", le: "delle" },
  a: { il: "al", lo: "allo", "l'": "all'", la: "alla", i: "ai", gli: "agli", le: "alle" },
  da: { il: "dal", lo: "dallo", "l'": "dall'", la: "dalla", i: "dai", gli: "dagli", le: "dalle" },
  in: { il: "nel", lo: "nello", "l'": "nell'", la: "nella", i: "nei", gli: "negli", le: "nelle" },
  su: { il: "sul", lo: "sullo", "l'": "sull'", la: "sulla", i: "sui", gli: "sugli", le: "sulle" },
};
const UNCONTRACT = {};
for (const [prep, forms] of Object.entries(CONTRACT)) {
  for (const [art, joined] of Object.entries(forms)) UNCONTRACT[joined] = { prep, art };
}

// Genere e numero della risposta, dalla prima parola (articolo o nome).
export function whiteAgreement(text) {
  const words = text.replace(/[^\p{L}'\s-]/gu, " ").trim().split(/\s+/).filter(Boolean);
  if (!words.length) return null;
  const first = words[0].toLowerCase();
  if (ART[first]) return { ...ART[first] };
  if (SINGULAR_IN_I.has(first)) return { g: null, n: "s" };
  if (/(zione|sione|tà|ù)$/.test(first) || /a$/.test(first)) return { g: "f", n: "s" };
  if (/o$/.test(first)) return { g: "m", n: "s" };
  if (/i$/.test(first)) return { g: null, n: "p" };
  if (/[^aeiouàèéìòù]$/.test(first)) return { g: "m", n: "s" }; // festival, sport, bar: quasi tutti maschili
  return null;
}

function defForm(g, n, next, prep) {
  const gender = g ?? "m";
  let form;
  if (n === "s" && gender === "m") form = VOWEL.test(next) ? "l'" : IMPURE.test(next) ? "lo" : "il";
  else if (n === "s") form = VOWEL.test(next) ? "l'" : "la";
  else if (gender === "f") form = "le";
  else form = VOWEL.test(next) || IMPURE.test(next) ? "gli" : "i";
  return prep ? CONTRACT[prep][form] : form;
}

function indefForm(g, n, next) {
  const gender = g ?? "m";
  if (n === "s") {
    if (gender === "f") return VOWEL.test(next) ? "un'" : "una";
    return IMPURE.test(next) ? "uno" : "un";
  }
  if (gender === "f") return "delle";
  return VOWEL.test(next) || IMPURE.test(next) ? "degli" : "dei";
}

function matchMirror(s, c) {
  return s[0] === s[0].toUpperCase() && s[0] !== s[0].toLowerCase() ? c[0].toUpperCase() + c.slice(1) : c;
}

// Riscrive l'articolo che precede lo spazio, in base alla risposta scelta.
export function fixArticle(before, white) {
  const agr = whiteAgreement(white);
  if (!agr) return { before, consumed: false };
  const m = before.match(/(^|[\s(])((?:di|a|da|in|su)\s+)?(il|lo|la|l'|i|gli|le|un'|un|uno|una|del|dello|della|dell'|dei|degli|delle|al|allo|alla|all'|ai|agli|alle|dal|dallo|dalla|dall'|dai|dagli|dalle|nel|nello|nella|nell'|nei|negli|nelle|sul|sullo|sulla|sull'|sui|sugli|sulle)(\s*)$/i);
  if (!m) return { before, consumed: false };
  const head = before.slice(0, before.length - m[0].length);
  const lead = m[1];
  let prep = m[2] ? m[2].trim().toLowerCase() : null;
  let art = m[3].toLowerCase();
  if (UNCONTRACT[art]) { prep = UNCONTRACT[art].prep; art = UNCONTRACT[art].art; }
  const trail = m[4];
  const next = firstWord(white);
  const isDef = ["il", "lo", "l'", "la", "i", "gli", "le"].includes(art);
  let form;
  if (isDef) form = defForm(agr.g, agr.n, next, prep);
  else if (!prep) form = indefForm(agr.g, agr.n, next);
  else return { before, consumed: false }; // "di un ..." non si tocca
  // La preposizione (se c'era) è già dentro la forma: "a" + "il" diventa "al".
  form = matchMirror(m[3], form);
  // Dopo l'elisione ("all'") non c'è spazio: "all'alcolismo".
  const sep = form.endsWith("'") ? "" : trail;
  return { before: head + lead + form + sep, consumed: true };
}

function firstWord(text) {
  const w = text.replace(/[^\p{L}'\s-]/gu, " ").trim().split(/\s+/)[0] ?? "";
  return w;
}

// Togliere la maiuscola se la risposta va in mezzo alla frase, salvo i nomi propri.
function lowerIfMidSentence(text) {
  const words = text.trim().split(/\s+/);
  const twoCaps = words.length > 1 && /^\p{Lu}/u.test(words[0]) && /^\p{Lu}/u.test(words[1]);
  if (twoCaps) return text;
  return text.charAt(0).toLowerCase() + text.slice(1);
}

// Per ogni spazio: testo prima, parola inserita, testo dopo.
// whites[i] = testo della risposta per lo spazio i, oppure null se non ancora scelta.
export function fillSentence(blackText, whites) {
  const parts = blackText.split("____");
  const segs = [];
  for (let i = 0; i < parts.length; i++) {
    let before = parts[i];
    if (i === parts.length - 1) {
      segs.push({ t: "text", v: before });
      break;
    }
    const white = whites[i];
    if (white == null) {
      segs.push({ t: "text", v: before }, { t: "slot", i });
      continue;
    }
    const after = parts[i + 1];
    const atEnd = after.trim() === "" && i === parts.length - 2;
    const atStart = before.trim() === "";
    const fixed = fixArticle(before, white);
    let w = white.trim();
    // Se l'articolo è stato riscritto, togli quello della risposta per non averne due.
    if (fixed.consumed && /^(il|lo|la|l'|i|gli|le|un|uno|una|un')\s+/i.test(w)) {
      w = w.replace(/^\S+\s+/, "");
    }
    if (!atEnd) w = w.replace(/[.!?]+$/, "");
    if (!atStart && !fixed.consumed) w = lowerIfMidSentence(w);
    else if (!atStart && fixed.consumed) w = lowerIfMidSentence(w);
    segs.push({ t: "text", v: fixed.before }, { t: "word", v: w, i });
    parts[i + 1] = after;
  }
  return segs;
}

export function sentencePlain(blackText, whites) {
  return fillSentence(blackText, whites).map((s) => (s.t === "slot" ? "____" : s.v)).join("");
}


// Suoni e musica generati con Web Audio: nessun file esterno.
// La musica è un loop semplice (accordi Am–F–C–G, arpeggio e basso).
const Sound = (() => {
  let ctx = null, master = null, sfxBus = null, musicBus = null;
  let musicOn = false, sfxOn = true, timer = null, step = 0, nextTime = 0;
  const PROG = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]]; // Am F C G (MIDI)
  const STEP = 60 / 100 / 2; // ottavi a 100 BPM

  const hz = (midi) => 440 * Math.pow(2, (midi - 69) / 12);

  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.8;
      master.connect(ctx.destination);
      sfxBus = ctx.createGain();
      sfxBus.connect(master);
      musicBus = ctx.createGain();
      musicBus.gain.value = 0.18;
      musicBus.connect(master);
    }
    if (ctx.state === "suspended") ctx.resume();
    return true;
  }

  function blip(freq, t, dur, type, bus, peak, slideTo) {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(bus);
    o.start(t);
    o.stop(t + dur + 0.05);
  }

  const SFX = {
    pick: (t) => blip(880, t, 0.06, "square", sfxBus, 0.05),
    confirm: (t) => { blip(523, t, 0.12, "triangle", sfxBus, 0.25); blip(784, t + 0.09, 0.16, "triangle", sfxBus, 0.25); },
    deal: (t) => blip(320, t, 0.08, "triangle", sfxBus, 0.12, 520),
    flip: (t) => blip(1200, t, 0.09, "sine", sfxBus, 0.12, 600),
    win: (t) => [523, 659, 784, 1046].forEach((f, i) => blip(f, t + i * 0.09, 0.22, "triangle", sfxBus, 0.28)),
    slam: (t) => blip(150, t, 0.2, "sawtooth", sfxBus, 0.3, 40),
    error: (t) => blip(140, t, 0.22, "sawtooth", sfxBus, 0.18, 90),
  };

  function musicStep(t, s) {
    const chord = PROG[Math.floor(s / 8) % PROG.length];
    const n = chord[s % 3] + (s % 4 === 3 ? 12 : 0);
    blip(hz(n), t, STEP * 0.9, "triangle", musicBus, 0.5);
    if (s % 8 === 0) blip(hz(chord[0] - 24), t, STEP * 3.5, "sine", musicBus, 0.8);
  }

  function pump() {
    while (nextTime < ctx.currentTime + 0.15) {
      musicStep(nextTime, step);
      nextTime += STEP;
      step += 1;
    }
  }

  return {
    unlock() { return ensure(); },
    play(name) {
      if (!sfxOn || !ensure()) return;
      SFX[name]?.(ctx.currentTime + 0.01);
    },
    setSfx(on) { sfxOn = !!on; },
    setVolume(v) { if (ensure()) musicBus.gain.value = 0.18 * v; },
    setMusic(on) {
      musicOn = !!on;
      if (!musicOn) { clearInterval(timer); timer = null; if (ctx) musicBus.gain.value = 0; return; }
      if (!ensure()) return;
      musicBus.gain.value = 0.18;
      if (!timer) {
        nextTime = ctx.currentTime + 0.05;
        step = 0;
        timer = setInterval(pump, 60);
      }
    },
  };
})();

};

function loadSettings() {
  try { return { ...DEFAULT_SETTINGS, ...JSON.parse(localStorage.getItem("cah-settings") || "{}") }; }
  catch (e) { return { ...DEFAULT_SETTINGS }; }
}
function saveSettings() {
  try { localStorage.setItem("cah-settings", JSON.stringify(settings)); } catch (e) { /* memoria del browser non disponibile */ }
}

const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "style") n.setAttribute("style", v);
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return n;
};

// ------------------------------------------------------------------ impostazioni

function applySettings() {
  const root = document.documentElement;
  root.style.setProperty("--ts", settings.textScale);
  root.style.setProperty("--cs", settings.cardScale);
  root.style.setProperty("--card-font", FONTS[settings.font].css);
  if (settings.theme === "system") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", settings.theme);
  document.body.classList.toggle("no-motion", !settings.motion);
  document.body.classList.toggle("motion-on", settings.motion);
  Sound.setSfx(settings.sfx);
  Sound.setVolume(settings.musicVol);
  Sound.setMusic(unlocked && settings.music);
}

function openSettings() {
  const close = () => { bg.remove(); };
  const set = (key, value) => { settings[key] = value; saveSettings(); applySettings(); rebuild(); };
  const seg = (key, options) => el("div", { class: "seg" }, options.map(([v, label]) =>
    el("button", { type: "button", "aria-pressed": String(settings[key] === v), onclick: () => set(key, v) }, label)));
  const toggle = (key, label) => el("div", { class: "row" },
    el("span", {}, label),
    el("button", { class: "toggle", type: "button", "aria-pressed": String(!!settings[key]), onclick: () => set(key, !settings[key]) }, settings[key] ? "Attivo" : "Spento"));
  const slider = (key, label, min, max, step, fmt) => el("div", { class: "row", style: "flex-direction:column;align-items:stretch" },
    el("div", { class: "row" }, el("span", {}, label), el("span", { class: "status" }, fmt(settings[key]))),
    el("input", { type: "range", min, max, step, value: settings[key], "aria-label": label,
      oninput: (e) => { settings[key] = Number(e.target.value); applySettings(); saveSettings(); e.target.parentElement.querySelector(".status").textContent = fmt(settings[key]); } }));

  const rebuild = () => {
    sheet.replaceChildren(...buildSheetContent());
  };
  const buildSheetContent = () => [
    el("div", { class: "row" }, el("h2", { style: "font-size:22px" }, "Impostazioni"),
      el("button", { type: "button", class: "ghost", onclick: close }, "Chiudi")),
    el("div", { class: "group" }, el("span", { class: "label" }, "Tema"),
      seg("theme", [["system", "Sistema"], ["light", "Chiaro"], ["dark", "Scuro"]])),
    el("div", { class: "group" }, el("span", { class: "label" }, "Font delle carte"),
      el("div", { class: "fonts" }, Object.entries(FONTS).map(([k, f]) =>
        el("button", { type: "button", style: `font-family:${f.css}`, "aria-pressed": String(settings.font === k), onclick: () => set("font", k) }, f.label)))),
    el("div", { class: "group" }, el("span", { class: "label" }, "Dimensioni"),
      slider("textScale", "Testo sulle carte", 0.8, 1.4, 0.05, (v) => `${Math.round(v * 100)}%`),
      slider("cardScale", "Grandezza delle carte", 0.8, 1.3, 0.05, (v) => `${Math.round(v * 100)}%`)),
    el("div", { class: "group" }, el("span", { class: "label" }, "Audio"),
      toggle("music", "Musica di sottofondo"),
      slider("musicVol", "Volume musica", 0, 1, 0.05, (v) => `${Math.round(v * 100)}%`),
      toggle("sfx", "Effetti sonori")),
    el("div", { class: "group" }, el("span", { class: "label" }, "Movimento"),
      toggle("motion", "Animazioni")),
    el("button", { type: "button", class: "ghost", onclick: () => { settings = { ...DEFAULT_SETTINGS }; saveSettings(); applySettings(); rebuild(); } }, "Ripristina predefiniti"),
  ];

  const sheet = el("div", { class: "sheet", role: "dialog", "aria-label": "Impostazioni" }, buildSheetContent());
  const bg = el("div", { class: "sheet-bg", onclick: (e) => { if (e.target === bg) close(); } }, sheet);
  document.body.append(bg);
}

function logoNode(big = false) {
  const svg = `<svg viewBox="0 0 120 96" aria-hidden="true">
    <rect x="10" y="14" width="56" height="76" rx="9" fill="#111" transform="rotate(-10 38 52)"/>
    <rect x="50" y="10" width="56" height="76" rx="9" fill="#fff" stroke="#111" stroke-width="3" transform="rotate(8 78 48)"/>
    <circle cx="30" cy="36" r="5" fill="#c4502a" transform="rotate(-10 38 52)"/>
    <text x="78" y="62" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="30" fill="#111" text-anchor="middle" transform="rotate(8 78 48)">?</text>
  </svg>`;
  const wrap = el("div", { class: "logo" + (big ? " big" : "") });
  wrap.innerHTML = svg;
  wrap.append(el("div", { class: "wordmark" },
    el("span", {}, "Cards"),
    el("span", { class: "acc" }, "Against"),

// ------------------------------------------------------------------ setup

function setup() {
  game = null;
  clearTimeout(botTimer); clearTimeout(judgeTimer);
  const total = () => cfg.names.length + cfg.bots;
  const hint = el("p", { class: "hidden-msg" });
  const startBtn = el("button", { class: "primary", type: "button", onclick: start }, "Inizia la partita");

  const refresh = () => {
    const ok = total() >= 3;
    startBtn.disabled = !ok;
    hint.textContent = ok ? `${total()} giocatori in tutto (${cfg.names.length} ${cfg.names.length === 1 ? "persona" : "persone"}, ${cfg.bots} bot).`
      : "Servono almeno 3 giocatori: aggiungi una persona o un bot.";
  };

  const nameRows = () => cfg.names.map((n, i) => el("div", { class: "nrow" },
    el("input", { type: "text", value: n, maxlength: "16", placeholder: `Giocatore ${i + 1}`, "aria-label": `Nome giocatore ${i + 1}`,
      oninput: (e) => { cfg.names[i] = e.target.value; refresh(); } }),
    cfg.names.length > 1 ? el("button", { type: "button", class: "ghost", "aria-label": "Rimuovi", onclick: () => { cfg.names.splice(i, 1); setup(); } }, "✕") : null));

  const botBtns = [0, 1, 2, 3].map((n) => el("button", {
    type: "button", "aria-pressed": String(cfg.bots === n),
    onclick: () => { cfg.bots = n; setup(); },
  }, n === 0 ? "Nessuno" : `${n} bot`));
  const winBtns = [3, 5, 8].map((n) => el("button", {
    type: "button", "aria-pressed": String(cfg.winScore === n),
    onclick: () => { cfg.winScore = n; setup(); },
  }, `${n} punti`));

  app.replaceChildren(
    el("section", { class: "setup" },
      logoNode(true),
      el("p", { class: "hidden-msg" }, "Carte italiane. Gioca con amici sullo stesso telefono, o contro i bot."),
      el("button", { type: "button", class: "primary", onclick: onlineMenu }, "🌐 Gioca online (stanza)"),
      el("div", { class: "panel" },
        el("span", { class: "label" }, `Giocatori (${cfg.names.length}/${MAX_HUMANS})`),
        el("div", { class: "names" }, nameRows()),
        cfg.names.length < MAX_HUMANS ? el("button", { type: "button", class: "ghost", onclick: () => { cfg.names.push(""); setup(); } }, "+ Aggiungi persona") : null,
        el("span", { class: "label", style: "margin-top:6px" }, "Bot"),
        el("div", { class: "seg" }, botBtns),
        el("span", { class: "label", style: "margin-top:6px" }, "Vittoria"),
        el("div", { class: "seg" }, winBtns),
        hint,
        startBtn,
        el("button", { type: "button", class: "ghost", onclick: openSettings }, "⚙ Impostazioni"),
      ),
    ),
  );
  refresh();
}

function start() {
  unlocked = true;
  applySettings();
  const names = cfg.names.map((n, i) => (n || "").trim().slice(0, 16) || `Giocatore ${i + 1}`);
  const players = names.map((name, i) => ({ id: `h${i}`, name }));
  for (let i = 1; i <= cfg.bots; i++) players.push({ id: `bot${i}`, name: `Bot ${i}`, isBot: true });
  game = new Game(players, CARDS, { winScore: cfg.winScore });
  selected = [];
  judgeSel = null;
  viewer = null;
  lastViewer = null;
  dealPending = true;
  slamPending = true;
  game.start();
  Sound.play("deal");
  step();
}

// ------------------------------------------------------------------ partita

const readingMs = (n) => Math.min(60000, 15000 + 8000 * n);
const humanIds = () => game.players.filter((p) => !p.isBot).map((p) => p.id);

// Chi deve guardare lo schermo adesso: chi deve giocare, o il Re.
function viewerFor() {
  if (online) return online.you;
  const humans = humanIds();
  if (game.phase === "playing") {
    return humans.find((id) => id !== game.judge.id && !game.submissions.has(id)) ?? humans[0];
  }
  return game.judge.isBot ? humans[0] : game.judge.id;
}

function step() {
  clearTimeout(botTimer); clearTimeout(judgeTimer);
  if (online) return render();   // online: il server decide tutto, la UI segue lo stato
  if (!game) return;
  if (game.phase === "playing") {
    const botsPending = game.players.some((p) => p.isBot && p.id !== game.judge.id && !game.submissions.has(p.id));
    if (botsPending) botTimer = setTimeout(() => { game.playBots(); step(); }, 650);
  } else if (game.phase === "judging" && game.judge.isBot) {
    judgeTimer = setTimeout(() => { game.judgeIfBot(); step(); }, readingMs(game.revealOrder.length));
  }
  render();
}

function humanPlay() {
  if (selected.length !== game.currentBlack.blanks) return;
  try {
    game.play(viewer, selected);
    selected = [];
    Sound.play("confirm");
  } catch (err) {
    Sound.play("error");
    render();
    return;
  }
  step();
}

function humanConfirmJudge() {
  if (judgeSel === null) return;
  game.pick(viewer, judgeSel);
  judgeSel = null;
  Sound.play("confirm");
  step();
}

function nextRound() {
  game.nextRound();
  selected = [];
  judgeSel = null;
  dealPending = true;
  slamPending = true;
  Sound.play("slam");
  step();
}

function resetJudgeIfNewRound() {
  if (judgeRound !== game.round) {
    judgeRound = game.round;
    judgeView = 0;
    judgeMode = "browse";
    judgeSel = null;
  }
}

function previewWhites(s) {
  const out = new Array(s.black.blanks).fill(null);
  if (s.phase === "judging" && s.judgeId === viewer) {
    const r = s.reveal[judgeView];
    if (r) r.cards.forEach((c, i) => { out[i] = c.text; });
  } else if (s.phase === "playing") {
    selected.forEach((id, i) => { out[i] = game.text(id); });
  }
  return out;
}

function blackCard(s, whites, { canPlay, label, slam } = {}) {
  const segs = fillSentence(s.black.text, whites);
  const nodes = segs.map((x) => {
    if (x.t === "text") return x.v;
    if (x.t === "word") return el("span", { class: "word" }, x.v);
    return el("span", { class: canPlay ? "slot lit" : "slot" }, "_____");
  });
  return el("div", { class: "black-wrap" },
    el("div", { class: "black" + (slam ? " slam" : ""), role: "region", "aria-label": "Carta nera" },
      el("div", { class: "text" }, ...nodes),
      el("div", { class: "foot" }, label ?? (s.black.blanks > 1 ? `${s.black.blanks} risposte` : "1 risposta"))));
}

function confetti() {
  const box = el("div", { class: "confetti", "aria-hidden": "true" });
  const colors = ["#c4502a", "#2f7a4d", "#f6c445", "#3b7dd8", "#e95b8a", "#ffffff"];
  for (let k = 0; k < 70; k++) {
    const piece = el("i", {});
    piece.style.left = `${Math.random() * 100}%`;
    piece.style.background = colors[k % colors.length];
    piece.style.animationDelay = `${Math.random() * 0.6}s`;
    piece.style.setProperty("--dx", `${(Math.random() - 0.5) * 180}px`);
    piece.style.setProperty("--rot", `${Math.random() * 720 - 360}deg`);
    box.append(piece);
  }
  document.body.append(box);
  setTimeout(() => box.remove(), 3300);
}

function render() {
  if (online && !online.state?.game) return renderLobby();
  if (!game) return setup();
  const next = viewerFor();
  if (next !== lastViewer) {
    lastViewer = next;
    viewer = next;
    selected = [];
    judgeSel = null;
    curtain = !online && humanIds().length > 1;
  }
  viewer = next;
  const s = game.publicState(viewer);
  const isJudge = s.judgeId === viewer;
  const me = s.players.find((p) => p.id === viewer);
  const need = s.black ? s.black.blanks : 1;
  const judging = s.phase === "judging" && isJudge;
  if (judging) resetJudgeIfNewRound();
  const showPrivate = !curtain;

  const board = el("div", { class: "board", role: "list" },
    s.players.map((p) => {
      const won = s.phase === "roundEnd" && game.lastWinner === p.id && wonRound === s.round;
      return el("div", {
        class: ["seat", p.id === s.judgeId ? "judge" : "", p.hasPlayed ? "played" : "", won ? "won" : ""].join(" "),
        role: "listitem",
      },
        el("div", { class: "name" }, p.name),
        el("div", { class: "pts" }, p.score),
        el("div", { class: "tag" }, p.id === s.judgeId ? "Re" : `${p.handSize} carte`));
    }));

  const topbar = el("div", { class: "topbar" },
    logoNode(false),
    el("div", { class: "tools" },
      el("button", { type: "button", class: "ghost", "aria-label": "Impostazioni", onclick: openSettings }, "⚙"),
      el("button", { type: "button", class: "ghost", onclick: exitGame }, "Esci")));

  const roundline = el("div", { class: "roundline" },
    el("span", { class: "status" }, el("strong", {}, `Round ${s.round}`), `  ·  Re: ${game.judge.name}`),
    el("span", { class: "status" }, `Vittoria a ${game.opts.winScore} punti`));

  let mainCard = null;
  let note = null;
  let actions = null;
  let rail = null;
  let railLabel = "";

  if (s.phase === "over") {
    const w = game.player(game.winner);
    note = el("div", { class: "banner win" },
      el("h2", {}, `Ha vinto ${w.name}`),
      el("p", { class: "hidden-msg" }, `Punteggio finale: ${w.score} punti.`),
      el("button", { class: "primary", type: "button", onclick: exitGame }, "Nuova partita"));
  } else if (judging && showPrivate) {
    const total = s.reveal.length;
    if (judgeMode === "browse") {
      const r = s.reveal[judgeView];
      mainCard = blackCard(s, r.cards.map((c) => c.text), { label: `Combinazione ${judgeView + 1} di ${total}` });
      note = el("p", { class: "hidden-msg" }, "Leggi tutte le combinazioni. Non sai chi le ha giocate.");
      actions = el("div", { class: "judge-nav" },
        el("button", { type: "button", disabled: judgeView === 0, onclick: () => { judgeView -= 1; render(); } }, "← Precedente"),
        judgeView < total - 1
          ? el("button", { class: "primary", type: "button", onclick: () => { judgeView += 1; Sound.play("flip"); render(); } }, "Successiva →")
          : el("button", { class: "primary", type: "button", onclick: () => { judgeMode = "compare"; enterPending = true; Sound.play("flip"); render(); } }, "Vedi tutte e tre"));
    } else {
      note = el("p", { class: "hidden-msg" }, "Tutte le combinazioni. Scegli quella che ti ha fatto ridere di più.");
      const enter = enterPending;
      enterPending = false;
      rail = el("div", { class: "minis", role: "group", "aria-label": "Combinazioni" },
        s.reveal.map((r) => {
          const text = fillSentence(s.black.text, r.cards.map((c) => c.text)).map((x) => (x.t === "slot" ? "_____" : x.v)).join("");
          const node = el("button", {
            class: "mini" + (judgeSel === r.index ? " sel" : "") + (enter ? " enter" : ""),
            type: "button",
            "aria-pressed": String(judgeSel === r.index),
            onclick: () => { judgeSel = judgeSel === r.index ? null : r.index; Sound.play("pick"); render(); },
          }, el("span", {}, text), el("span", { class: "foot" }, `Combinazione ${r.index + 1}`));
          node.style.setProperty("--i", r.index);
          return node;
        }));
      actions = el("div", { class: "judge-nav" },
        el("button", { type: "button", onclick: () => { judgeMode = "browse"; judgeView = 0; render(); } }, "Rivedi una per una"),
        el("button", { class: "primary", type: "button", disabled: judgeSel === null, onclick: humanConfirmJudge }, "Scegli questa risposta"));
    }
  } else if (s.phase === "judging") {
    note = el("p", { class: "hidden-msg" }, `${game.judge.name} sta leggendo le risposte…`);
  } else if (s.phase === "roundEnd") {
    const last = game.lastWinner ? game.player(game.lastWinner) : null;
    if (wonRound !== s.round && last) {
      wonRound = s.round;
      confetti();
      Sound.play("win");
    }
    note = el("div", { class: "banner" },
      el("p", { style: "margin:0" }, last ? `Round vinto da ${last.name}.` : ""),
      el("button", { class: "primary", type: "button", onclick: nextRound }, "Prossimo round"));
  } else if (isJudge) {
    note = el("p", { class: "hidden-msg" }, "Sei il Re: aspetta che gli altri confermino.");
  } else if (me.hasPlayed) {
    note = el("p", { class: "hidden-msg" }, "Risposta confermata. Aspetta gli altri giocatori.");
  }

  // Carta nera in cima, tranne nella vista "tutte e tre" del Re.
  if (!(judging && judgeMode === "compare" && showPrivate)) {
    const canPlay = s.phase === "playing" && !isJudge && !me.hasPlayed && showPrivate;
    const slam = slamPending;
    slamPending = false;
    mainCard = blackCard(s, previewWhites(s), { canPlay, slam });
  }

  // Mano: fila di default quando non stai giudicando e lo schermo è tuo.
  if (s.phase !== "over" && !judging && me.hand && showPrivate) {
    const canSelect = s.phase === "playing" && !isJudge && !me.hasPlayed;
    railLabel = `La tua mano · ${me.hand.length} carte`;
    const deal = dealPending;
    dealPending = false;
    rail = el("div", { class: "rail", role: "group", "aria-label": "La tua mano" },
      me.hand.map((c, i) => {
        const idx = selected.indexOf(c.id);
        const full = selected.length >= need && idx < 0;
        const node = el("button", {
          class: "card" + (idx >= 0 ? " sel" : "") + (deal ? " deal" : ""),
          type: "button",
          disabled: !canSelect || full,
          "aria-pressed": String(idx >= 0),
          onclick: () => {
            if (idx >= 0) selected.splice(idx, 1);
            else selected.push(c.id);
            Sound.play("pick");
            render();
          },
        }, el("span", { class: "num" }, idx >= 0 ? String(idx + 1) : ""), el("span", { class: "txt" }, c.text));
        node.style.setProperty("--i", i);
        return node;
      }));
    if (canSelect) {
      actions = el("div", { class: "actions" },
        el("span", { class: "status" }, need > 1 ? `${selected.length}/${need} · nell'ordine di lettura` : `${selected.length}/${need}`),
        el("button", { class: "primary", type: "button", disabled: selected.length !== need, onclick: humanPlay }, "Conferma e gioca"));
    }
  }

  const railBlock = rail ? el("div", { class: "col", style: "gap:6px" },
    railLabel ? el("span", { class: "label" }, railLabel) : null,
    rail) : null;

  const who = curtain ? el("div", { class: "curtain", role: "dialog", "aria-label": "Passa il telefono" },
    el("div", { class: "box" },
      el("span", { class: "label" }, "Passa il telefono"),
      el("div", { class: "big" }, `Tocca per ${me.name}`),
      el("p", { class: "hidden-msg" }, "Le tue carte sono nascoste finché non tocchi."),
      el("button", { class: "primary", type: "button", onclick: () => { curtain = false; Sound.play("deal"); render(); } }, `Sono ${me.name}, mostra le carte`))) : null;

  app.replaceChildren(
    el("div", {},
      topbar,
      board,
      roundline,
      mainCard,
      note,
      actions,
      railBlock,
      who,
    ),
  );
}

// Primo gesto dell'utente: sblocca l'audio e applica le impostazioni sonore.
document.addEventListener("pointerdown", () => {
  if (unlocked) return;
  unlocked = true;
  Sound.unlock();
  applySettings();
}, { once: false });

// ------------------------------------------------------------------ online
// Il server tiene stanze, mani e turni. Qui c'è solo la connessione e una "partita"
// che legge lo stato ricevuto, con gli stessi metodi del motore locale.

const ONLINE_OK = /^https?:$/.test(location.protocol);
const SESSION_KEY = "cah-online";
let onlineSock = null;
let onlineQueue = [];   // azioni in attesa che la connessione sia aperta
let onlineWin = 5;
let onlineName = "";
let onlineError = "";

const loadSession = () => {
  try { return JSON.parse(sessionStorage.getItem(SESSION_KEY) || "null"); } catch { return null; }
};
const saveSession = (v) => {
  try {
    if (v) sessionStorage.setItem(SESSION_KEY, JSON.stringify(v));
    else sessionStorage.removeItem(SESSION_KEY);
  } catch { /* nessuno storage: si perde solo la riconnessione */ }
};

function toast(msg) {
  const t = el("div", { class: "toast", role: "status" }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 3000);
}

function netSend(obj) {
  if (onlineSock && onlineSock.readyState === 1) onlineSock.send(JSON.stringify(obj));
}

function withSocket(fn) {
  if (onlineSock && onlineSock.readyState === 1) return fn();
  onlineQueue.push(fn);
  if (!onlineSock || onlineSock.readyState > 1) openSocket();
}

function openSocket() {
  if (!ONLINE_OK) {
    onlineError = "Il gioco online funziona aprendo la pagina dal server (npm start).";
    onlineQueue = [];
    return;
  }
  let ws;
  try {
    ws = new WebSocket(`${location.protocol === "https:" ? "wss:" : "ws:"}//${location.host}/ws`);
  } catch {
    onlineError = "Connessione online non disponibile qui.";
    onlineQueue = [];
    return;
  }
  onlineSock = ws;
  ws.onopen = () => {
    const q = onlineQueue;
    onlineQueue = [];
    q.forEach((f) => f());
  };
  ws.onmessage = (e) => {
    try { onMessage(JSON.parse(e.data)); } catch { /* messaggio non valido: ignorato */ }
  };
  ws.onclose = () => {
    if (onlineSock !== ws) return;
    onlineSock = null;
    const hadQueue = onlineQueue.length > 0;
    onlineQueue = [];
    if (online) {
      online.offline = true;
      render();
      if (loadSession()) setTimeout(() => withSocket(resumeSaved), 2000);
      return;
    }
    if (hadQueue) {
      onlineError = "Non riesco a collegarmi al server. Il gioco online va aperto dal server (npm start).";
      onlineMenu();
    }
  };
}

function resumeSaved() {
  const s = loadSession();
  if (s) netSend({ type: "resume", code: s.code, token: s.token });
}

function onMessage(m) {
  if (m.type === "error") {
    Sound.play("error");
    if (m.message === "Sessione non valida") {
      saveSession(null);
      online = null;
      game = null;
      onlineError = "";
      setup();
      return;
    }
    if (online) toast(m.message);
    else { onlineError = m.message; onlineMenu(); }
    return;
  }
  if (m.type === "joined") {
    online = { ...(online || {}), code: m.code, you: m.playerId, state: online?.state ?? null, offline: false, winScore: onlineWin };
    saveSession({ code: m.code, token: m.token });
    onlineError = "";
    return;
  }
  if (m.type === "state") {
    const prev = online?.state?.game ?? null;
    online = { ...(online || {}), code: m.code, you: m.you, state: m, offline: false, winScore: onlineWin };
    if (m.game) {
      if (!prev || prev.round !== m.game.round) {
        dealPending = true;
        slamPending = true;
        selected = [];
        judgeSel = null;
      }
      game = makeAdapter(m);
    } else {
      game = null;
    }
    render();
  }
}

// Stesso contratto del motore locale, ma i dati arrivano dal server e le azioni vanno via rete.
function makeAdapter(m) {
  const s = m.game;
  const handOf = () => s.players.find((p) => p.id === m.you)?.hand ?? [];
  return {
    phase: s.phase,
    round: s.round,
    judge: s.players.find((p) => p.id === s.judgeId) ?? { id: s.judgeId, name: "?" },
    players: s.players.map((p) => ({ ...p, isBot: false })),
    currentBlack: s.black,
    winner: s.winner,
    lastWinner: s.lastWinner,
    opts: { winScore: s.winScore },
    publicState: () => s,
    player: (id) => s.players.find((p) => p.id === id),
    text: (id) => [...handOf(), ...(s.reveal || []).flatMap((r) => r.cards)].find((c) => c.id === id)?.text ?? "",
    play: (_id, ids) => netSend({ type: "play", cards: ids }),
    pick: (_id, index) => netSend({ type: "pick", index }),
    nextRound: () => netSend({ type: "next" }),
  };
}

function exitGame() {
  if (online) {
    netSend({ type: "leave" });
    saveSession(null);
    online = null;
  }
  clearTimeout(botTimer); clearTimeout(judgeTimer);
  game = null;
  setup();
}

function onlineMenu() {
  game = null;
  const nameIn = el("input", { type: "text", maxlength: "20", placeholder: "Il tuo nome", "aria-label": "Il tuo nome", value: onlineName,
    oninput: (e) => { onlineName = e.target.value; } });
  const codeIn = el("input", { type: "text", maxlength: "4", placeholder: "Codice", "aria-label": "Codice stanza",
    style: "text-transform:uppercase", oninput: (e) => { e.target.value = e.target.value.toUpperCase(); } });
  app.replaceChildren(
    el("section", { class: "setup" },
      logoNode(true),
      el("p", { class: "hidden-msg" }, "Crea una stanza e condividi il codice: fino a 10 giocatori, ognuno sul proprio telefono."),
      el("div", { class: "panel" },
        el("span", { class: "label" }, "Il tuo nome"),
        nameIn,
        el("button", { type: "button", class: "primary", onclick: () => {
          onlineError = ""; onlineName = nameIn.value.trim();
          withSocket(() => netSend({ type: "create", name: onlineName }));
        } }, "Crea una stanza"),
        el("span", { class: "label", style: "margin-top:6px" }, "Entra con un codice"),
        el("div", { class: "nrow" }, codeIn,
          el("button", { type: "button", onclick: () => {
            onlineError = ""; onlineName = nameIn.value.trim();
            withSocket(() => netSend({ type: "join", code: codeIn.value.trim(), name: onlineName }));
          } }, "Entra")),
        onlineError ? el("p", { class: "hidden-msg err" }, onlineError) : null,
        el("button", { type: "button", class: "ghost", onclick: () => { onlineError = ""; setup(); } }, "← Indietro"))));
}

function renderLobby() {
  const st = online.state;
  if (!st) {
    app.replaceChildren(el("section", { class: "setup" }, logoNode(true),
      el("p", { class: "hidden-msg" }, online.offline ? "Riconnessione in corso…" : "Mi collego alla stanza…")));
    return;
  }
  const isHost = st.hostId === online.you;
  const total = st.players.length;
  const ok = total >= 3;
  const seg = [3, 5, 8].map((n) => el("button", {
    type: "button", "aria-pressed": String(onlineWin === n),
    onclick: () => { onlineWin = n; render(); },
  }, `${n} punti`));
  app.replaceChildren(
    el("section", { class: "setup" },
      logoNode(true),
      el("div", { class: "panel" },
        el("span", { class: "label" }, "Codice della stanza"),
        el("div", { class: "code" }, st.code),
        el("button", { type: "button", class: "ghost", onclick: () => {
          navigator.clipboard?.writeText(st.code).catch(() => {});
          toast("Codice copiato");
        } }, "Copia codice"),
        el("span", { class: "label", style: "margin-top:6px" }, `Giocatori (${total}/10)`),
        el("ul", { class: "plist" }, st.players.map((p) => el("li", {},
          el("span", { class: "dot" + (p.connected ? " on" : "") }),
          `${p.name}${p.id === st.hostId ? " · host" : ""}${p.id === online.you ? " (tu)" : ""}`))),
        isHost ? el("span", { class: "label", style: "margin-top:6px" }, "Vittoria") : null,
        isHost ? el("div", { class: "seg" }, seg) : null,
        isHost
          ? el("button", { type: "button", class: "primary", disabled: !ok, onclick: () => netSend({ type: "start", winScore: onlineWin }) }, "Avvia partita")
          : el("p", { class: "hidden-msg" }, ok ? "In attesa che l'host avvii la partita." : "Servono almeno 3 giocatori per iniziare."),
        isHost && !ok ? el("p", { class: "hidden-msg" }, "Servono almeno 3 giocatori.") : null,
        el("button", { type: "button", class: "ghost", onclick: exitGame }, "Esci dalla stanza"))));
}

function boot() {
  const s = loadSession();
  if (s && ONLINE_OK) {
    online = { code: s.code, you: null, state: null, offline: true, winScore: onlineWin };
    render();
    withSocket(resumeSaved);
    return;
  }
  setup();
}

document.head.append(el("style", {}, `
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:50}
.code{font-family:var(--card-font,inherit);font-size:44px;letter-spacing:.2em;font-weight:800;text-align:center;padding:8px 0}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:var(--ok)}
.err{color:var(--accent)}
`));

applySettings();
boot();

</script>
