<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 120 96%27%3E%3Crect x=%2710%27 y=%2714%27 width=%2756%27 height=%2776%27 rx=%279%27 fill=%27%23111%27 transform=%27rotate(-10 38 52)%27/%3E%3Crect x=%2750%27 y=%2710%27 width=%2756%27 height=%2776%27 rx=%279%27 fill=%27%23fff%27 stroke=%27%23111%27 stroke-width=%273%27 transform=%27rotate(8 78 48)%27/%3E%3C/svg%3E">
<title>CAH Italiano</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Fraunces:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=Permanent+Marker&display=swap">
<style>
/* Tavolo: carta calda e inchiostro, accento arancio bruciato. Le carte da gioco restano sempre
   bianche e nere, in qualsiasi tema. */
:root {
  --bg: #ece5d6; --fg: #1c1a17; --muted: #6d655a; --line: #d6ccb9;
  --paper: #fbf8f0; --accent: #c4502a; --ok: #2f7a4d;
  --ts: 1; --cs: 1; --card-font: "Bricolage Grotesque", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14120f; --fg: #ece5d6; --muted: #a0978a; --line: #36312a;
    --paper: #2a2620; --accent: #f08a5d; --ok: #6cc08c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14120f; --fg: #ece5d6; --muted: #a0978a; --line: #36312a;
  --paper: #2a2620; --accent: #f08a5d; --ok: #6cc08c; color-scheme: dark;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; color: var(--fg);
  background:
    radial-gradient(900px 480px at 50% -12%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 62%),
    radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--fg) 7%, transparent) 1px, transparent 0) 0 0 / 18px 18px,
    var(--bg);
  font: 400 15px/1.45 "IBM Plex Sans", system-ui, sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 28px;
}
.col { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
h1, h2, .display { font-family: "Bricolage Grotesque", system-ui, sans-serif; text-wrap: balance; margin: 0; }
.label { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.hidden-msg { color: var(--muted); font-size: 14px; margin: 0; }
button {
  font: inherit; font-weight: 600; color: inherit; cursor: pointer; touch-action: manipulation;
  border: 1px solid var(--line); background: var(--paper); border-radius: 12px; padding: 11px 16px;
  transition: transform .15s, background .15s;
}
button:active:not(:disabled) { transform: scale(.97); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 8px 18px -10px var(--accent); }
button.ghost { background: transparent; }
button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
input[type="text"] { font: inherit; color: inherit; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; }
input[type="range"] { width: 100%; accent-color: var(--accent); }

/* Logo */
.logo { display: flex; align-items: center; gap: 12px; }
.logo svg { width: 64px; height: 52px; flex: 0 0 auto; }
.wordmark { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; line-height: .95; letter-spacing: -.01em; }
.wordmark span { display: block; }
.wordmark .acc { color: var(--accent); }
.wordmark i { display: block; margin-top: 8px; font-style: normal; font-size: 11px; letter-spacing: .2em; color: var(--muted); font-weight: 600; }
.logo.big svg { width: 120px; height: 96px; }
.logo.big .wordmark { font-size: 40px; }
.logo.big .wordmark i { font-size: 13px; }

/* Schermata iniziale */
.setup { display: flex; flex-direction: column; gap: 18px; padding-top: 18px; align-items: center; text-align: center; }
.setup .panel { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 10px;
  background: color-mix(in srgb, var(--paper) 80%, transparent); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.names { display: flex; flex-direction: column; gap: 8px; }
.names .nrow { display: flex; gap: 8px; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }

/* Tavolo */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.topbar .logo { gap: 8px; }
.topbar .logo svg { width: 36px; height: 30px; }
.topbar .wordmark { font-size: 15px; }
.topbar .wordmark i { display: none; }
.topbar .tools { display: flex; gap: 6px; }
.topbar .tools button { padding: 8px 12px; }
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
.seat {
  padding: 8px 10px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line);
  transition: transform .3s cubic-bezier(.2,.9,.3,1.3), border-color .3s, box-shadow .3s;
}
.seat.judge { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 10px 18px -12px var(--accent); }
.seat.won { animation: pop .6s cubic-bezier(.2,.9,.3,1.4); border-color: var(--ok); }
.seat .name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seat .pts { font-family: "Bricolage Grotesque", sans-serif; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.seat .tag { font-size: 11px; color: var(--muted); }
.seat.played .tag::after { content: " · pronto"; color: var(--ok); }
.status { font-size: 14px; color: var(--muted); }
.status strong { color: var(--fg); }
.roundline { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

/* Carta nera */
.black-wrap { display: flex; justify-content: center; perspective: 900px; }
.black {
  width: min(100%, calc(300px * var(--cs))); aspect-ratio: 5 / 7; background: #111; color: #fff;
  border-radius: 16px; padding: 20px 18px; display: flex; flex-direction: column; justify-content: space-between;
  box-shadow: 0 14px 30px -14px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.04);
  font-family: var(--card-font); font-size: calc(20px * var(--ts) * var(--cs)); line-height: 1.32; font-weight: 500;
  overflow: hidden; position: relative;
}
.black::after { /* grana da carta */
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .07; border-radius: inherit;
  background-image: radial-gradient(#fff 0.6px, transparent 0.7px); background-size: 4px 4px;
}
.black .text { text-wrap: pretty; overflow-wrap: anywhere; position: relative; z-index: 1; }
.black .foot { font-size: 11px; font-family: "IBM Plex Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; opacity: .6; position: relative; z-index: 1; }
.slot {
  display: inline-block; min-width: 3.6em; border-bottom: 2px dashed color-mix(in srgb, var(--accent) 80%, transparent);
  color: transparent; padding: 0 3px;
}
.slot.lit { animation: pulse 1.6s ease-in-out infinite; border-bottom-style: solid; border-color: var(--accent); }
.word { display: inline-block; color: inherit; animation: pop .45s cubic-bezier(.2,.9,.3,1.5); }
@keyframes pulse { 0%,100% { background: transparent; } 50% { background: color-mix(in srgb, var(--accent) 26%, transparent); } }
@keyframes pop { 0% { transform: scale(.3) rotate(-12deg); opacity: 0; } 70% { transform: scale(1.12) rotate(2deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }
@keyframes slam { 0% { transform: translateY(-40px) rotate(-4deg) scale(1.06); opacity: 0; } 60% { transform: translateY(6px) rotate(1deg); opacity: 1; } 100% { transform: none; } }
.black.slam { animation: slam .55s cubic-bezier(.2,.9,.3,1.2); }

/* Carte bianche: sempre bianche con scritta nera. */
.rail { display: flex; gap: 12px; overflow-x: auto; padding: 16px 8px 12px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
.rail > * { flex: 0 0 auto; scroll-snap-align: center; }
.card {
  position: relative; width: calc(138px * var(--cs)); aspect-ratio: 5 / 7; display: flex; align-items: flex-end;
  text-align: left; font-family: var(--card-font); font-weight: 600; font-size: calc(14px * var(--ts) * var(--cs)); line-height: 1.3; color: #111;
  background: #fff; border: 1px solid #d6d0c2; border-radius: 12px; padding: 12px 12px 14px;
  box-shadow: 0 8px 18px -10px rgba(0,0,0,.45); overflow: hidden; overflow-wrap: anywhere;
  transition: transform .25s cubic-bezier(.2,.9,.3,1.3), box-shadow .25s, border-color .25s;
}
.rail .card { transform: none; }
.card:hover:not(:disabled) { transform: translateY(-6px) rotate(0deg); }
.card:disabled { opacity: .5; cursor: default; }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 16px 26px -14px rgba(0,0,0,.55); transform: translateY(-16px) rotate(0deg) scale(1.03); }
.card .num {
  position: absolute; left: 8px; top: 8px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff;
  display: none; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; animation: pop .35s cubic-bezier(.2,.9,.3,1.5);
}
.card.sel .num { display: flex; }
.card.deal { animation: deal .5s cubic-bezier(.2,.9,.3,1.1) both; animation-delay: calc(var(--i, 0) * 70ms); }
@keyframes deal { from { transform: translate(-30vw, -60px) rotate(-18deg) scale(.6); opacity: 0; } to { opacity: 1; } }

/* Risposte del Re: sfogliatura e confronto */
.judge-nav { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.minis { display: grid; grid-template-columns: repeat(auto-fit, minmax(calc(150px * var(--cs)), 1fr)); gap: 12px; }
.mini {
  aspect-ratio: 5 / 7; background: #111; color: #fff; border: 2px solid transparent; border-radius: 14px; padding: 14px;
  text-align: left; font-family: var(--card-font); font-size: calc(16px * var(--ts) * var(--cs)); line-height: 1.32; font-weight: 500;
  overflow: hidden; overflow-wrap: anywhere; box-shadow: 0 10px 20px -12px rgba(0,0,0,.55);
  display: flex; flex-direction: column; justify-content: space-between;
}
.mini.enter { animation: flip .55s cubic-bezier(.2,.9,.3,1.1) both; animation-delay: calc(var(--i, 0) * 120ms); }
.mini.sel { border-color: var(--accent); }
.mini .foot { font-family: "IBM Plex Sans", sans-serif; font-size: 11px; opacity: .6; }
@keyframes flip { from { transform: rotateY(90deg) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }

/* Banner e messaggi */
.banner { padding: 16px; border-radius: 16px; background: var(--paper); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.banner.win { border-color: var(--ok); }
.actions { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

/* Passaggio del telefono */
.curtain {
  position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; text-align: center;
  background: color-mix(in srgb, var(--bg) 88%, #000 12%); backdrop-filter: blur(10px);
  padding: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) 24px max(24px, env(safe-area-inset-left, 0px));
  animation: fade .3s ease both;
}
.curtain .box { display: flex; flex-direction: column; gap: 18px; align-items: center; max-width: 360px; }
.curtain .big { font-family: "Permanent Marker", cursive; font-size: 34px; line-height: 1.1; transform: rotate(-3deg); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* Impostazioni */
.sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s both; }
.sheet {
  width: 100%; max-width: 640px; max-height: 88vh; overflow: auto; background: var(--bg); color: var(--fg);
  border-radius: 22px 22px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px;
  animation: slide .35s cubic-bezier(.2,.9,.3,1.1) both; box-shadow: 0 -20px 40px -20px rgba(0,0,0,.5);
}
@keyframes slide { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet .group { display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
.sheet .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sheet .fonts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.sheet .fonts button { font-family: var(--f); font-size: 16px; text-align: left; }
.toggle { min-width: 64px; }

/* Coriandoli */
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 30; }
.confetti i { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 2px; animation: fall 2.4s cubic-bezier(.3,.1,.6,1) forwards; }
@keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--rot)); opacity: .9; } }

/* Preferenza: movimento ridotto */
body.no-motion *, body.no-motion *::before, body.no-motion *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  body:not(.motion-on) *, body:not(.motion-on) *::before, body:not(.motion-on) *::after { animation: none !important; transition: none !important; }
}

/* ===== Ridisegno: partita a tutto schermo, senza scorrimento della pagina ===== */
#app:has(.game) { max-width: none; height: calc(100dvh - 44px); }
body:has(.game) { overflow: hidden; }
.game { height: 100%; min-height: 0; width: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; --ch: clamp(120px, 19dvh, 170px); }
.hud { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.hud .topbar .wordmark { font-size: 15px; }
.board { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 1px 4px; }
.board::-webkit-scrollbar { display: none; }
.seat { flex: 0 0 auto; min-width: 96px; display: grid; grid-template-columns: 1fr auto; column-gap: 8px; align-items: center; padding: 7px 10px; border-radius: 12px; }
.seat .name { grid-column: 1; }
.seat .tag { grid-column: 1; font-size: 10.5px; }
.seat .pts { grid-column: 2; grid-row: 1 / span 2; font-size: 24px; line-height: 1; }
.roundline { font-size: 13px; }

.stage { min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; overflow: hidden; }
.stage .black-wrap { flex: 1 1 auto; min-height: 0; width: 100%; align-items: center; container-type: size; }
.stage .black { width: min(100cqw, 100cqh * 5 / 7); height: auto; aspect-ratio: 5 / 7; padding: 18px 16px;
  font-size: calc(clamp(15px, 3.1dvh, 24px) * var(--ts) * var(--cs)); }
.stage > .hidden-msg { text-align: center; font-size: 13px; }
.stage .banner { flex-direction: row; align-items: center; justify-content: space-between; width: 100%; padding: 10px 14px; }
.stage .minis { width: 100%; overflow: auto; max-height: 100%; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }

.dock { min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.dock .actions { flex: 0 0 auto; justify-content: flex-end; }
.dock .actions button.primary { width: auto; padding: 6px 12px; font-size: 13px; }
*, *::before, *::after { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
input, textarea { -webkit-user-select: text; user-select: text; }
::selection { background: transparent; }
.dock .judge-nav { flex: 0 0 auto; }
.dock > .col { gap: 4px; min-height: 0; flex: 1 1 auto; }
.dock .rail { flex: 1 1 auto; min-height: 0; align-items: flex-end; padding: 14px 6px 8px; gap: 10px; }
.rail .card { width: calc(var(--ch) * 5 / 7); height: var(--ch); aspect-ratio: auto;
  font-size: calc(var(--ch) * 0.09 * var(--ts) * var(--cs)); line-height: 1.22; padding: 9px 9px 10px; border-radius: 10px; }
.rail .card .txt { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.rail .card .num { width: 22px; height: 22px; font-size: 12px; }
.card .num { position: absolute; top: 6px; right: 6px; }

/* Ingrandimento di una carta tenuta premuta */
.zoom-bg { position: fixed; inset: 0; z-index: 60; background: rgba(10,8,6,.72); display: flex; align-items: center; justify-content: center; padding: 24px; animation: fade .2s both; }
.zoom { height: min(74dvh, calc((100vw - 48px) * 7 / 5)); aspect-ratio: 5 / 7; background: #fff; color: #111; border-radius: 18px; padding: 22px 20px;
  display: flex; align-items: flex-end; box-shadow: 0 30px 60px -20px rgba(0,0,0,.6); animation: pop .35s cubic-bezier(.2,.9,.3,1.3) both; }
.zoom .txt { font-family: var(--card-font); font-weight: 700; font-size: clamp(20px, 4.4dvh, 34px); line-height: 1.22; overflow-wrap: anywhere; }

/* Orizzontale: tavolo a sinistra, mano a destra in una griglia che scorre da sola */
@media (orientation: landscape) and (max-height: 640px) {
  .game { grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr) minmax(250px, 40%); column-gap: 14px; --ch: 40dvh; }
  .hud { grid-column: 1 / -1; grid-row: 1; }
  .stage { grid-column: 1; grid-row: 2; }
  .dock { grid-column: 2; grid-row: 2; }
  .dock .rail { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); overflow-y: auto; overflow-x: hidden; align-content: start; flex-direction: initial; padding: 12px 4px 6px; gap: 10px; }
  .rail .card { width: 100%; height: auto; aspect-ratio: 5 / 7; font-size: calc(clamp(10px, 2.3dvh, 14px) * var(--ts) * var(--cs)); }
  .rail .card .txt { -webkit-line-clamp: 7; }
  .rail .card .num { width: 20px; height: 20px; font-size: 11px; }
  .stage .black { padding: 14px 12px; }
  .stage .black-wrap { container-type: size; }
  .board { padding-bottom: 0; }
  .seat { padding: 5px 9px; min-width: 88px; }
  .seat .pts { font-size: 20px; }
  .roundline { font-size: 12px; }
}

/* Home: poster, due modalità, pannello sotto */
.hero { position: relative; overflow: hidden; width: 100%; border-radius: 26px; padding: 22px 18px 20px; background: var(--fg); color: var(--bg);
  display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.hero::before { content: ""; position: absolute; left: -90px; bottom: -130px; width: 240px; height: 240px; border-radius: 50%; background: var(--accent); opacity: .85; }
.hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .09;
  background-image: radial-gradient(#fff 1px, transparent 1.2px); background-size: 9px 9px; }
.hero > * { position: relative; z-index: 1; }
.hero .wordmark { color: var(--bg); }
.hero .wordmark .acc { color: var(--accent); }
.hero .wordmark i { color: var(--bg); opacity: .65; }
.tagline { margin: 0; font-size: 14px; opacity: .8; max-width: 320px; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.mode { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 14px 14px; border-radius: 18px; text-align: left; }
.mode strong { font-family: "Bricolage Grotesque", sans-serif; font-size: 17px; font-weight: 800; }
.mode .sub { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.mode[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 10px 22px -12px var(--accent); }
.mode[aria-pressed="true"] .sub { color: rgba(255,255,255,.85); }
.mode[aria-pressed="false"] { background: var(--paper); }
.setup .panel { border-radius: 22px; padding: 18px; }
.settings-btn { align-self: center; border-radius: 999px; padding: 8px 16px; font-size: 14px; }
button.primary { padding: 14px 18px; font-size: 16px; }
.err { color: var(--accent); }

/* Sillabazione e interlinea: parole spezzate in sillabe, righe più respirate */
html, body, .card, .pcard, .black, .zoom, .black .text, .rail .card .txt { hyphens: auto; -webkit-hyphens: auto; }
.card, .black .text, .zoom .txt { overflow-wrap: break-word; word-break: normal; }
.card { line-height: 1.28; letter-spacing: -.003em; }
.black { line-height: 1.34; }
.rail .card .txt { line-height: 1.28; }
/* Nomi giocatori come gli spazi da riempire: fondo tenue e sottolineatura arancio. Carte senza bordi colorati. */
.seat {
  border: none; border-bottom: 3px solid var(--accent); border-radius: 8px 8px 0 0;
  background: color-mix(in srgb, var(--accent) 12%, var(--paper));
}
.seat.judge { border-color: var(--accent); background: var(--accent); color: #fff; box-shadow: none; }
.seat.judge .tag, .seat.judge .name, .seat.judge .pts { color: #fff; }
.seat.won { border-bottom-color: var(--ok); }
.card, .pcard, .zoom, .rail .card { border-color: color-mix(in srgb, var(--muted) 45%, transparent) !important; }
.rail .card.sel { border-color: var(--accent) !important; }
/* Mano a scorrimento orizzontale: le carte restano su una riga e si scorrono con il dito. */
@media (orientation: portrait) {

<div id="app" class="col" aria-live="polite"></div>

<script type="module">
// Motore delle regole di Cards Against Humanity (versione italiana).
// Nessuna dipendenza esterna: gira identico nel server Node e nel client.
// Ogni mutazione restituisce una lista di eventi, utile per animare la UI.

export const DEFAULTS = {
  handSize: 10,
  winScore: 8, // le regole non fissano una fine: è un'opzione della stanza
};

// Generatore pseudo-casuale deterministico (mulberry32) per test ripetibili.
export function seededRng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

export function shuffle(items, rng = Math.random) {
  const a = items.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Divide il testo di una carta nera in segmenti, per disegnare gli spazi.
export function segments(text) {
  return text.split("____").flatMap((part, i, arr) => {
    const out = [{ type: "text", value: part }];
    if (i < arr.length - 1) out.push({ type: "blank", index: i });
    return out;
  });
}

export class Game {
  /**
   * @param {{id:string,name:string,isBot?:boolean}[]} players
   * @param {{white:{id:string,text:string}[], black:{id:string,text:string,blanks:number}[]}} cards
   * @param {{handSize?:number, winScore?:number|null, rng?:() => number}} options
   */
  constructor(players, cards, options = {}) {
    if (players.length < 3) throw new Error("Servono almeno 3 giocatori");
    const ids = new Set(players.map((p) => p.id));
    if (ids.size !== players.length) throw new Error("ID giocatori duplicati");

    this.opts = { ...DEFAULTS, ...options };
    this.rng = this.opts.rng ?? Math.random;
    this.cardText = new Map([...cards.white, ...cards.black].map((c) => [c.id, c.text]));
    this.catById = new Map([...cards.white, ...cards.black].map((c) => [c.id, c.cat ?? "Originali"]));
    this.whiteById = new Map(cards.white.map((c) => [c.id, c]));
    this.blackById = new Map(cards.black.map((c) => [c.id, c]));

    this.players = players.map((p) => ({
      id: p.id,
      name: p.name,
      isBot: !!p.isBot,
      hand: [],
      score: 0,
    }));
    this.deck = shuffle(cards.white.map((c) => c.id), this.rng);
    this.discard = [];
    this.blackDeck = shuffle(cards.black.map((c) => c.id), this.rng);
    this.blackDiscard = [];

    this.phase = "lobby"; // lobby | playing | judging | roundEnd | over
    this.round = 0;
    this.judgeIndex = -1;
    this.currentBlack = null;
    this.submissions = new Map(); // playerId -> cardIds
    this.revealOrder = []; // playerIds in ordine mischiato per il giudice
    this.lastWinner = null;
    this.winner = null;
  }

  // ---------------------------------------------------------------- mazzi

  // Le carte già giocate non tornano nel mazzo: a mazzo esaurito la pesca si ferma.
  draw() {
    return this.deck.pop() ?? null;
  }

  drawBlack() {
    return this.blackDeck.pop() ?? null;
  }

  text(cardId) {
    return this.cardText.get(cardId);
  }

  get judge() {
    return this.judgeIndex >= 0 ? this.players[this.judgeIndex] : null;
  }

  player(id) {
    const p = this.players.find((x) => x.id === id);
    if (!p) throw new Error(`Giocatore sconosciuto: ${id}`);
    return p;
  }

  // ---------------------------------------------------------------- partita

  start() {
    if (this.phase !== "lobby") throw new Error("La partita è già iniziata");
    const events = [];
    this.dealOpening(events);
    for (const p of this.players) {
      this.fill(p, events);
    }
    this.judgeIndex = Math.floor(this.rng() * this.players.length);
    this.beginRound(events);
    return events;
  }

  // Pescata iniziale: per ogni giocatore almeno 4 Soggetti e 4 Azioni,
  // le altre carte a caso in categorie diverse. Nessuna carta è data a due giocatori.
  dealOpening(events) {
    const cat = (id) => this.catById.get(id);
    const pool = this.deck.slice();
    const takeOne = (pred) => {
      const i = pool.findIndex(pred);
      return i < 0 ? null : pool.splice(i, 1)[0];
    };
    for (const p of this.players) {
      const picks = [];
      for (let k = 0; k < 4; k++) {
        const id = takeOne((x) => cat(x) === "Soggetti");
        if (id !== null) picks.push(id);
      }
      for (let k = 0; k < 4; k++) {
        const id = takeOne((x) => cat(x) === "Azioni");
        if (id !== null) picks.push(id);
      }
      const usedCats = new Set();
      const others = Math.max(0, this.opts.handSize - picks.length);
      for (let k = 0; k < others; k++) {
        const id = takeOne((x) => !usedCats.has(cat(x)) && cat(x) !== "Soggetti" && cat(x) !== "Azioni")
          ?? takeOne(() => true);
        if (id === null) break;
        usedCats.add(cat(id));
        picks.push(id);
      }
      for (const id of picks) {
        p.hand.push(id);
        events.push({ type: "draw", playerId: p.id, cardId: id });
      }
    }
    this.deck = pool;
  }

  fill(player, events) {
    while (player.hand.length < this.opts.handSize) {
      const id = this.draw();
      if (id === null) break;
      player.hand.push(id);
      events.push({ type: "draw", playerId: player.id, cardId: id });
    }
  }

  beginRound(events) {
    if (this.currentBlack) this.blackDiscard.push(this.currentBlack.id);
    this.currentBlack = this.blackById.get(this.drawBlack());
    this.round += 1;
    this.submissions = new Map();
    this.revealOrder = [];
    this.phase = "playing";
    events.push({ type: "round", round: this.round, judgeId: this.judge.id, blackId: this.currentBlack.id });
  }

  /** Il giocatore invia le carte bianche per completare la nera. */
  play(playerId, cardIds) {
    if (this.phase !== "playing") throw new Error("Non è il momento di giocare");
    const p = this.player(playerId);
    if (p.id === this.judge.id) throw new Error("Il Re delle Carte non gioca carte bianche");
    if (this.submissions.has(playerId)) throw new Error("Hai già giocato");
    const need = this.currentBlack.blanks;
    if (cardIds.length !== need) throw new Error(`Servono ${need} carte`);
    if (new Set(cardIds).size !== cardIds.length) throw new Error("Carte duplicate");
    for (const id of cardIds) {
      if (!p.hand.includes(id)) throw new Error("Carta non in mano");
    }

    const events = [];
    for (const id of cardIds) {
      p.hand.splice(p.hand.indexOf(id), 1);
      this.discard.push(id);
    }
    this.submissions.set(playerId, cardIds.slice());
    events.push({ type: "played", playerId, cardIds: cardIds.slice() });

    const expected = this.players.length - 1;
    if (this.submissions.size === expected) {
      this.phase = "judging";
      this.revealOrder = shuffle([...this.submissions.keys()], this.rng);
      events.push({ type: "judging", count: this.revealOrder.length });
    }
    return events;
  }

  /** Versione per il giudice: le risposte senza nome. */
  reveal() {
    if (this.phase !== "judging") return [];
    return this.revealOrder.map((playerId, index) => ({
      index,
      cards: this.submissions.get(playerId).map((id) => ({ id, text: this.text(id) })),
    }));
  }

  /** Il Re sceglie la risposta preferita. */
  pick(judgeId, index) {
    if (this.phase !== "judging") throw new Error("Non ci sono risposte da giudicare");
    if (judgeId !== this.judge.id) throw new Error("Solo il Re può scegliere");
    if (!Number.isInteger(index) || index < 0 || index >= this.revealOrder.length) {
      throw new Error("Scelta non valida");
    }
    const winnerId = this.revealOrder[index];
    const winner = this.player(winnerId);
    winner.score += 1;
    this.lastWinner = winnerId;
    this.phase = "roundEnd";

    const events = [{ type: "picked", winnerId, index, blackId: this.currentBlack.id }];
    const turnEnd = this.checkWinner();
    if (turnEnd) events.push(turnEnd);
    return events;
  }

  checkWinner() {
    if (this.opts.winScore == null) return null;
    const top = this.players.reduce((a, b) => (b.score > a.score ? b : a));
    if (top.score >= this.opts.winScore) {
      this.winner = top.id;
      this.phase = "over";
      return { type: "gameOver", winnerId: top.id, score: top.score };
    }
    return null;
  }

  /** Dopo la scelta: rimette in mano le carte, passa il Re, apre la nuova nera. */
  nextRound() {
    if (this.phase !== "roundEnd") throw new Error("Il round non è ancora concluso");
    const events = [];
    this.judgeIndex = (this.judgeIndex + 1) % this.players.length;
    for (const p of this.players) this.fill(p, events);
    this.beginRound(events);
    return events;
  }

  // ------------------------------------------------ fallback per timeout / bot

  /** Gioca per conto di un giocatore: carte casuali, nell'ordine di pesca. */
  autoPlay(playerId) {
    const p = this.player(playerId);
    const n = this.currentBlack.blanks;
    const picks = shuffle(p.hand, this.rng).slice(0, n);
    return this.play(playerId, picks);
  }

  /** Il giudice non sceglie in tempo: viene scelta una risposta a caso. */
  autoPick() {
    const index = Math.floor(this.rng() * this.revealOrder.length);
    return this.pick(this.judge.id, index);
  }

  /** Gioca per tutti i bot che devono ancora rispondere. */
  playBots() {
    const events = [];
    if (this.phase !== "playing") return events;
    for (const p of this.players) {
      if (!p.isBot || p.id === this.judge.id || this.submissions.has(p.id)) continue;
      events.push(...this.autoPlay(p.id));
      if (this.phase !== "playing") break;
    }
    return events;
  }

  /** Se il giudice è un bot, sceglie per lui. */
  judgeIfBot() {
    if (this.phase === "judging" && this.judge.isBot) return this.autoPick();
    return [];
  }

  /** Stato pubblico: nessuna carta coperta visibile a nessun altro giocatore. */
  publicState(forPlayerId) {
    return {
      phase: this.phase,
      round: this.round,
      judgeId: this.judge?.id ?? null,
      black: this.currentBlack ? { id: this.currentBlack.id, text: this.currentBlack.text, blanks: this.currentBlack.blanks } : null,
      players: this.players.map((p) => ({
        id: p.id,
        name: p.name,
        score: p.score,
        isBot: p.isBot,
        handSize: p.hand.length,
        hasPlayed: this.submissions.has(p.id),
        hand: p.id === forPlayerId ? p.hand.map((id) => ({ id, text: this.text(id), cat: this.catById.get(id) })) : undefined,
      })),
      reveal: this.reveal(),
      winner: this.winner,
    };
  }
}

// ------------------------------------------------------------ carte personali

const BLANK = "____";

/** Pulisce le carte personali: testo corto, nere con 1–3 spazi, id nuovi e sicuri. */
export function sanitizeCustom(c) {
  const clean = (x) => String(x?.text ?? "").replace(/\s+/g, " ").trim().slice(0, 200);
  const catOf = (x) => String(x?.cat ?? "").replace(/\s+/g, " ").trim().slice(0, 20) || "Altro";
  const white = (Array.isArray(c?.white) ? c.white : []).slice(0, 300)
    .map((x) => ({ text: clean(x), cat: catOf(x) })).filter((x) => x.text)
    .map((x, i) => ({ id: `u${i}`, ...x }));
  const black = (Array.isArray(c?.black) ? c.black : []).slice(0, 150)
    .map((x) => {
      let text = clean(x);
      if (!text) return null;
      if (!text.includes(BLANK)) text += ` ${BLANK}`;
      const blanks = text.split(BLANK).length - 1;
      return blanks <= 3 ? { text, blanks, cat: catOf(x) } : null;
    })
    .filter(Boolean)
    .map((x, i) => ({ id: `ub${i}`, ...x }));
  return { white, black };
}

/** Mazzo completo: carte originali più quelle personali. */
export function mergeCustom(cards, custom) {
  const extra = sanitizeCustom(custom);
  return { white: [...cards.white, ...extra.white], black: [...cards.black, ...extra.black] };
}

/** Carte personali attive: solo le categorie abilitate (default: tutte). */
export function enabledCustom(custom) {
  const enabled = custom?.enabled ?? {};
  const on = (c) => enabled[c.cat] !== false;
  return { white: (custom?.white ?? []).filter(on), black: (custom?.black ?? []).filter(on) };
}

// Anteprima della frase: inserisce la carta bianca nello spazio e aggiusta
// articoli e preposizioni articolate in base a genere e numero della risposta.
// Euristica per l'italiano: non è un parser. Dove non è sicura, lascia il testo com'è.

const VOWEL = /^[aeiouàèéìòù]/i;
// Parole che richiedono "lo/uno/gli" davanti (s+consonante, z, gn, ps, x, y, i+vocale).
const IMPURE = /^(s[^aeiouàèéìòù\s]|z|gn|ps|x|y|i[aeouàèéìòù])/i;
const SINGULAR_IN_I = new Set(["analisi", "crisi", "tesi", "ipotesi", "sintesi", "noi"]);

const ART = {
  il: { g: "m", n: "s" }, lo: { g: "m", n: "s" }, "l'": { g: "m", n: "s" }, la: { g: "f", n: "s" },
  i: { g: "m", n: "p" }, gli: { g: "m", n: "p" }, le: { g: "f", n: "p" },
  un: { g: "m", n: "s" }, uno: { g: "m", n: "s" }, "un'": { g: "f", n: "s" }, una: { g: "f", n: "s" },
};

// Preposizioni articolate: [preposizione, articolo] -> forma unita.
const CONTRACT = {
  di: { il: "del", lo: "dello", "l'": "dell'", la: "della", i: "dei", gli: "degli", le: "delle" },
  a: { il: "al", lo: "allo", "l'": "all'", la: "alla", i: "ai", gli: "agli", le: "alle" },
  da: { il: "dal", lo: "dallo", "l'": "dall'", la: "dalla", i: "dai", gli: "dagli", le: "dalle" },
  in: { il: "nel", lo: "nello", "l'": "nell'", la: "nella", i: "nei", gli: "negli", le: "nelle" },
  su: { il: "sul", lo: "sullo", "l'": "sull'", la: "sulla", i: "sui", gli: "sugli", le: "sulle" },
};
const UNCONTRACT = {};
for (const [prep, forms] of Object.entries(CONTRACT)) {
  for (const [art, joined] of Object.entries(forms)) UNCONTRACT[joined] = { prep, art };
}

// Genere e numero della risposta, dalla prima parola (articolo o nome).
export function whiteAgreement(text) {
  const words = text.replace(/[^\p{L}'\s-]/gu, " ").trim().split(/\s+/).filter(Boolean);
  if (!words.length) return null;
  const first = words[0].toLowerCase();
  if (ART[first]) return { ...ART[first] };
  if (SINGULAR_IN_I.has(first)) return { g: null, n: "s" };
  if (/(zione|sione|tà|ù)$/.test(first) || /a$/.test(first)) return { g: "f", n: "s" };
  if (/o$/.test(first)) return { g: "m", n: "s" };
  if (/i$/.test(first)) return { g: null, n: "p" };
  if (/[^aeiouàèéìòù]$/.test(first)) return { g: "m", n: "s" }; // festival, sport, bar: quasi tutti maschili
  return null;
}

function defForm(g, n, next, prep) {
  const gender = g ?? "m";
  let form;
  if (n === "s" && gender === "m") form = VOWEL.test(next) ? "l'" : IMPURE.test(next) ? "lo" : "il";
  else if (n === "s") form = VOWEL.test(next) ? "l'" : "la";
  else if (gender === "f") form = "le";
  else form = VOWEL.test(next) || IMPURE.test(next) ? "gli" : "i";
  return prep ? CONTRACT[prep][form] : form;
}

function indefForm(g, n, next) {
  const gender = g ?? "m";
  if (n === "s") {
    if (gender === "f") return VOWEL.test(next) ? "un'" : "una";
    return IMPURE.test(next) ? "uno" : "un";
  }
  if (gender === "f") return "delle";
  return VOWEL.test(next) || IMPURE.test(next) ? "degli" : "dei";
}

function matchMirror(s, c) {
  return s[0] === s[0].toUpperCase() && s[0] !== s[0].toLowerCase() ? c[0].toUpperCase() + c.slice(1) : c;
}

// Riscrive l'articolo che precede lo spazio, in base alla risposta scelta.
export function fixArticle(before, white) {
  const agr = whiteAgreement(white);
  if (!agr) return { before, consumed: false };
  const m = before.match(/(^|[\s(])((?:di|a|da|in|su)\s+)?(il|lo|la|l'|i|gli|le|un'|un|uno|una|del|dello|della|dell'|dei|degli|delle|al|allo|alla|all'|ai|agli|alle|dal|dallo|dalla|dall'|dai|dagli|dalle|nel|nello|nella|nell'|nei|negli|nelle|sul|sullo|sulla|sull'|sui|sugli|sulle)(\s*)$/i);
  if (!m) return { before, consumed: false };
  const head = before.slice(0, before.length - m[0].length);
  const lead = m[1];
  let prep = m[2] ? m[2].trim().toLowerCase() : null;
  let art = m[3].toLowerCase();
  if (UNCONTRACT[art]) { prep = UNCONTRACT[art].prep; art = UNCONTRACT[art].art; }
  const trail = m[4];
  const next = firstWord(white);
  const isDef = ["il", "lo", "l'", "la", "i", "gli", "le"].includes(art);
  let form;
  if (isDef) form = defForm(agr.g, agr.n, next, prep);
  else if (!prep) form = indefForm(agr.g, agr.n, next);
  else return { before, consumed: false }; // "di un ..." non si tocca
  // La preposizione (se c'era) è già dentro la forma: "a" + "il" diventa "al".
  form = matchMirror(m[3], form);
  // Dopo l'elisione ("all'") non c'è spazio: "all'alcolismo".
  const sep = form.endsWith("'") ? "" : trail;
  return { before: head + lead + form + sep, consumed: true };
}

function firstWord(text) {
  const w = text.replace(/[^\p{L}'\s-]/gu, " ").trim().split(/\s+/)[0] ?? "";
  return w;
}

// Togliere la maiuscola se la risposta va in mezzo alla frase, salvo i nomi propri.
function lowerIfMidSentence(text) {
  const words = text.trim().split(/\s+/);
  // Sigle e acronimi in maiuscolo (BATMAN!!!) restano così come sono.
  if (/^\p{Lu}{2,}[\p{Lu}\p{P}\d]*$/u.test(words[0].replace(/[.,!?]+$/, ""))) return text;
  // Un articolo all'inizio non è un nome proprio: va in minuscolo anche se la parola dopo è maiuscola.
  const article = /^(Una|Un|Uno|Il|Lo|La|Gli|Le|I)$/.test(words[0]);
  const twoCaps = !article && words.length > 1 && /^\p{Lu}/u.test(words[0]) && /^\p{Lu}/u.test(words[1]);
  if (twoCaps) return text;
  return text.charAt(0).toLowerCase() + text.slice(1);
}

// "una" davanti a vocale diventa "un'" anche dopo la minuscola.
function elideUna(text) {
  return text.replace(/^una (?=[aeiouàèéìòùAEIOUÀÈÉÌÒÙ])/i, "un'");
}

// Per ogni spazio: testo prima, parola inserita, testo dopo.
// whites[i] = testo della risposta per lo spazio i, oppure null se non ancora scelta.
export function fillSentence(blackText, whites) {
  const parts = blackText.split("____");
  const segs = [];
  for (let i = 0; i < parts.length; i++) {
    let before = parts[i];
    if (i === parts.length - 1) {
      segs.push({ t: "text", v: before });
      break;
    }
    const white = whites[i];
    if (white == null) {
      segs.push({ t: "text", v: before }, { t: "slot", i });
      continue;
    }
    const after = parts[i + 1];
    const atEnd = after.trim() === "" && i === parts.length - 2;
    const atStart = before.trim() === "";
    const fixed = fixArticle(before, white);
    let w = white.trim();
    // Se l'articolo è stato riscritto, togli quello della risposta per non averne due.
    if (fixed.consumed && /^(il|lo|la|l'|i|gli|le|un|uno|una|un')\s+/i.test(w)) {
      w = w.replace(/^\S+\s+/, "");
    }
    if (!atEnd) w = w.replace(/[.!?]+$/, "");
    if (!atStart) w = elideUna(lowerIfMidSentence(w));
    segs.push({ t: "text", v: fixed.before }, { t: "word", v: w, i });
    parts[i + 1] = after;
  }
  // Anche nel testo fisso della carta nera: "una" davanti a vocale diventa "un'".
  return segs.map((x) => (x.t === "text" ? { ...x, v: x.v.replace(/\buna (?=[aeiouàèéìòùAEIOUÀÈÉÌÒÙ])/gi, (m) => (m[0] === "U" ? "Un'" : "un'")) } : x));
}

export function sentencePlain(blackText, whites) {
  return fillSentence(blackText, whites).map((s) => (s.t === "slot" ? "____" : s.v)).join("");
}


// Suoni e musica generati con Web Audio: nessun file esterno.
// La musica è un loop di 4 battute: batteria, basso e versi sintetizzati (rutti, scorregge,
// starnuti, colpi di tosse) nei punti fissi del loop, così ogni giro suona uguale.
const Sound = (() => {
  let ctx = null, master = null, sfxBus = null, musicBus = null;
  let musicOn = false, sfxOn = true, timer = null, step = 0, nextTime = 0;
  const STEP = 60 / 100 / 4; // sedicesimi a 100 BPM
  // Basso: quattro note per battuta, una ogni quattro sedicesimi (MIDI).
  const BASS = [[33, 33, 36, 38], [31, 31, 34, 36], [33, 33, 29, 31], [28, 28, 31, 33]];
  // Versi nel loop: "battuta:sedicesimo" -> verso.
  const VERSI = { "0:15": "rutto", "1:7": "scoreggia", "2:3": "starnuto", "2:13": "tosse", "3:10": "rutto", "3:15": "scoreggia" };

  const hz = (midi) => 440 * Math.pow(2, (midi - 69) / 12);

  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.8;
      master.connect(ctx.destination);
      sfxBus = ctx.createGain();
      sfxBus.connect(master);
      musicBus = ctx.createGain();
      musicBus.gain.value = 0.18;
      musicBus.connect(master);
    }
    if (ctx.state === "suspended") ctx.resume();
    return true;
  }

  function blip(freq, t, dur, type, bus, peak, slideTo) {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(bus);
    o.start(t);
    o.stop(t + dur + 0.05);
  }

  const SFX = {
    pick: (t) => blip(880, t, 0.06, "square", sfxBus, 0.05),
    confirm: (t) => { blip(523, t, 0.12, "triangle", sfxBus, 0.25); blip(784, t + 0.09, 0.16, "triangle", sfxBus, 0.25); },
    deal: (t) => blip(320, t, 0.08, "triangle", sfxBus, 0.12, 520),
    flip: (t) => blip(1200, t, 0.09, "sine", sfxBus, 0.12, 600),
    win: (t) => [523, 659, 784, 1046].forEach((f, i) => blip(f, t + i * 0.09, 0.22, "triangle", sfxBus, 0.28)),
    slam: (t) => blip(150, t, 0.2, "sawtooth", sfxBus, 0.3, 40),
    error: (t) => blip(140, t, 0.22, "sawtooth", sfxBus, 0.18, 90),
  };

  // Rumore bianco riusato, filtrato per ottenere i vari versi.
  let noiseBuf = null;
  function noiseSrc() {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    return src;
  }

  function burst(t, dur, freq, q, peak, bus, type = "bandpass", freqEnd = null) {
    const src = noiseSrc();
    const f = ctx.createBiquadFilter();
    f.type = type;
    f.frequency.setValueAtTime(freq, t);
    if (freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
    f.Q.value = q;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(bus);
    src.start(t); src.stop(t + dur + 0.05);
  }

  // Scoreggia: corpo grave con tremolo irregolare e crepitio.
  function scoreggia(t, bus) {
    const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(78, t);
    o.frequency.linearRampToValueAtTime(46, t + 0.9);
    f.type = "lowpass"; f.frequency.value = 420;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.7, t + 0.04);
    g.gain.setValueAtTime(0.55, t + 0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.95);
    lfo.frequency.value = 26; lg.gain.value = 0.22;
    lfo.connect(lg); lg.connect(g.gain);
    o.connect(f); f.connect(g); g.connect(bus);
    o.start(t); lfo.start(t); o.stop(t + 1); lfo.stop(t + 1);
    burst(t + 0.05, 0.8, 900, 0.7, 0.18, bus);
  }

  // Rutto: onda a dente con vibrato, filtro che scende come una gola che si svuota.
  function rutto(t, bus) {
    const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain(), v = ctx.createOscillator(), vg = ctx.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(150, t);
    o.frequency.linearRampToValueAtTime(92, t + 0.75);
    v.frequency.value = 18; vg.gain.value = 14;
    v.connect(vg); vg.connect(o.frequency);
    f.type = "bandpass"; f.Q.value = 3;
    f.frequency.setValueAtTime(560, t);
    f.frequency.linearRampToValueAtTime(260, t + 0.75);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.75, t + 0.08);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
    o.connect(f); f.connect(g); g.connect(bus);
    o.start(t); v.start(t); o.stop(t + 0.85); v.stop(t + 0.85);
  }

  // Starnuto: un "ha" di rumore, poi un "ciù" che sale.
  function starnuto(t, bus) {
    burst(t, 0.1, 2400, 1.2, 0.35, bus);
    burst(t + 0.12, 0.14, 900, 2, 0.3, bus);
    burst(t + 0.27, 0.22, 1400, 2.5, 0.4, bus, "bandpass", 2600);
  }

  // Colpo di tosse: due scoppi di rumore filtrato.
  function tosse(t, bus) {
    burst(t, 0.12, 1200, 1.5, 0.45, bus, "lowpass");
    burst(t + 0.22, 0.1, 1000, 1.5, 0.4, bus, "lowpass");
  }

  const VERSO = { rutto, scoreggia, starnuto, tosse };

  function musicStep(t, s) {
    const pos = s % 64;
    const bar = Math.floor(pos / 16), st = pos % 16;
    // Batteria: cassa sincopata, rullante sul 2 e sul 4, hi-hat continuo.
    if ([0, 6, 8, 14].includes(st)) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.15);
      g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.2);
    }
    if (st === 4 || st === 12) burst(t, 0.12, 1800, 0.8, 0.35, musicBus);
    if (st % 2 === 0) burst(t, 0.035, 7000, 0.5, 0.07, musicBus, "highpass");
    // Basso: una nota ogni quattro sedicesimi.
    if (st % 4 === 0) {
      const n = BASS[bar][st / 4];
      const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      o.type = "sawtooth"; o.frequency.value = hz(n);
      f.type = "lowpass"; f.frequency.value = 500;
      g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.0001, t + STEP * 3.5);
      o.connect(f); f.connect(g); g.connect(musicBus);
      o.start(t); o.stop(t + STEP * 4);
    }
    // Versi fissi del loop.
    const verso = VERSI[`${bar}:${st}`];
    if (verso) VERSO[verso](t, musicBus);
  }

  function pump() {
    while (nextTime < ctx.currentTime + 0.15) {
      musicStep(nextTime, step);
      nextTime += STEP;
      step += 1;
    }
  }

  return {
    unlock() { return ensure(); },
    play(name) {
      if (!sfxOn || !ensure()) return;
      SFX[name]?.(ctx.currentTime + 0.01);
    },
    setSfx(on) { sfxOn = !!on; },
    setVolume(v) { if (ensure()) musicBus.gain.value = 0.18 * v; },
    setMusic(on) {
      musicOn = !!on;
      if (!musicOn) { clearInterval(timer); timer = null; if (ctx) musicBus.gain.value = 0; return; }
      if (!ensure()) return;
      musicBus.gain.value = 0.18;
      if (!timer) {
        nextTime = ctx.currentTime + 0.05;
        step = 0;
        timer = setInterval(pump, 60);
      }
    },
  };
})();

const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "style") n.setAttribute("style", v);
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return n;
};

// ------------------------------------------------------------------ impostazioni

function applySettings() {
  const root = document.documentElement;
  root.style.setProperty("--ts", settings.textScale);
  root.style.setProperty("--cs", settings.cardScale);
  root.style.setProperty("--card-font", FONTS[settings.font].css);
  if (settings.theme === "system") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", settings.theme);
  document.body.classList.toggle("no-motion", !settings.motion);
  document.body.classList.toggle("motion-on", settings.motion);
  Sound.setSfx(settings.sfx);
  Sound.setVolume(settings.musicVol);
  Sound.setMusic(unlocked && settings.music);
}

// Aggiornamento dal repository: legge l'ultima release e offre la nuova APK.
const APP_VERSION = "0.2.0";
const UPDATE_API = "https://api.github.com/repos/viadimezzo99/cah-italiano/releases/latest";
const isNewer = (a, b) => {
  const x = a.split(".").map(Number), y = b.split(".").map(Number);
  for (let i = 0; i < 3; i++) {
    if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0);
  }
  return false;
};
function updateBox() {
  const out = el("div", { class: "status", role: "status", "aria-live": "polite" }, "Non ancora controllato");
  const check = async () => {
    out.textContent = "Controllo in corso…";
    try {
      const r = await fetch(UPDATE_API, { headers: { accept: "application/vnd.github+json" } });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const rel = await r.json();
      const latest = String(rel.tag_name || "").replace(/^v/, "");
      const apk = (rel.assets || []).find((a) => /\.apk$/i.test(a.name));
      if (!latest || !apk) { out.textContent = "Nessuna versione scaricabile al momento."; return; }
      if (!isNewer(latest, APP_VERSION)) { out.textContent = `Sei aggiornato (${APP_VERSION}).`; return; }
      out.replaceChildren(el("span", {}, `Versione ${latest} disponibile. `),
        el("a", { class: "primary", href: apk.browser_download_url, target: "_blank", rel: "noopener" }, "Scarica aggiornamento"),
        el("p", { class: "hidden-msg" }, "Il telefono scarica il file APK e ti chiede di installarlo."));
    } catch {
      out.textContent = "Non riesco a controllare. Serve la connessione e un repository pubblico.";
    }
  };
  return el("div", { class: "col", style: "gap:8px" }, out,
    el("button", { type: "button", class: "ghost", onclick: check }, "Controlla aggiornamenti"));
}

function openSettings() {
  const close = () => { bg.remove(); };
  const set = (key, value) => { settings[key] = value; saveSettings(); applySettings(); rebuild(); };
  const seg = (key, options) => el("div", { class: "seg" }, options.map(([v, label]) =>
    el("button", { type: "button", "aria-pressed": String(settings[key] === v), onclick: () => set(key, v) }, label)));
  const toggle = (key, label) => el("div", { class: "row" },
    el("span", {}, label),
    el("button", { class: "toggle", type: "button", "aria-pressed": String(!!settings[key]), onclick: () => set(key, !settings[key]) }, settings[key] ? "Attivo" : "Spento"));
  const slider = (key, label, min, max, step, fmt) => el("div", { class: "row", style: "flex-direction:column;align-items:stretch" },
    el("div", { class: "row" }, el("span", {}, label), el("span", { class: "status" }, fmt(settings[key]))),
    el("input", { type: "range", min, max, step, value: settings[key], "aria-label": label,
      oninput: (e) => { settings[key] = Number(e.target.value); applySettings(); saveSettings(); e.target.parentElement.querySelector(".status").textContent = fmt(settings[key]); } }));

  const rebuild = () => {
    sheet.replaceChildren(...buildSheetContent());
  };
  const buildSheetContent = () => [
    el("div", { class: "row" }, el("h2", { style: "font-size:22px" }, "Impostazioni"),
      el("button", { type: "button", class: "ghost", onclick: close }, "Chiudi")),
    el("div", { class: "group" }, el("span", { class: "label" }, "Tema"),
      seg("theme", [["system", "Sistema"], ["light", "Chiaro"], ["dark", "Scuro"]])),
    el("div", { class: "group" }, el("span", { class: "label" }, "Font delle carte"),
      el("div", { class: "fonts" }, Object.entries(FONTS).map(([k, f]) =>
        el("button", { type: "button", style: `font-family:${f.css}`, "aria-pressed": String(settings.font === k), onclick: () => set("font", k) }, f.label)))),
    el("div", { class: "group" }, el("span", { class: "label" }, "Dimensioni"),
      slider("textScale", "Testo sulle carte", 0.8, 1.4, 0.05, (v) => `${Math.round(v * 100)}%`),
      slider("cardScale", "Grandezza delle carte", 0.8, 1.3, 0.05, (v) => `${Math.round(v * 100)}%`)),
    el("div", { class: "group" }, el("span", { class: "label" }, "Audio"),
      toggle("music", "Musica di sottofondo"),
      slider("musicVol", "Volume musica", 0, 1, 0.05, (v) => `${Math.round(v * 100)}%`),
      toggle("sfx", "Effetti sonori")),
    el("div", { class: "group" }, el("span", { class: "label" }, "Movimento"),
      toggle("motion", "Animazioni")),
    el("div", { class: "group" }, el("span", { class: "label" }, `Aggiornamenti · versione ${APP_VERSION}`),
      updateBox()),
    el("button", { type: "button", class: "ghost", onclick: () => { settings = { ...DEFAULT_SETTINGS }; saveSettings(); applySettings(); rebuild(); } }, "Ripristina predefiniti"),
  ];

  const sheet = el("div", { class: "sheet", role: "dialog", "aria-label": "Impostazioni" }, buildSheetContent());
  const bg = el("div", { class: "sheet-bg", onclick: (e) => { if (e.target === bg) close(); } }, sheet);
  document.body.append(bg);
}

// Marchio testuale: tre righe, "Against" in arancio. Usato in home e nell'animazione d'apertura.
function wordmarkNode(cls) {
  return el("div", { class: cls + " wm", role: "img", "aria-label": "Cards Against Humanity, edizione italiana" },
    el("span", {}, "Cards"), el("span", { class: "acc" }, "Against"), el("span", {}, "Humanity"));
}

let introDone = false;
// Apertura: fondo nero, la scritta a sinistra con lo spazio vuoto, poi "Against" in arancio; infine la scritta scende in alto a sinistra.
function playIntro(target) {
  introDone = true;
  const ov = el("div", { class: "intro", "aria-hidden": "true" },
    el("div", { class: "iw" }, el("span", {}, "Cards"), el("span", { class: "gap" }), el("span", {}, "Humanity")));
  document.body.append(ov);
  const iw = ov.querySelector(".iw");
  setTimeout(() => {
    const gap = ov.querySelector(".gap");
    if (gap) {
      const acc = el("span", { class: "acc" }, "Against");
      gap.replaceWith(acc);
      acc.animate([{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }], { duration: 420, easing: "ease-out" });
    }
  }, 900);
  setTimeout(() => {
    target.style.visibility = "hidden";
    const from = iw.getBoundingClientRect();
    const to = target.getBoundingClientRect();
    const k = to.width / from.width;
    const dx = to.left - from.left, dy = to.top - from.top;
    iw.animate([{ transform: "none" }, { transform: `translate(${dx}px, ${dy}px) scale(${k})` }],
      { duration: 800, easing: "cubic-bezier(.2,.8,.2,1)", fill: "forwards" });
    const fade = ov.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 800, delay: 200, fill: "forwards" });
    fade.onfinish = () => { ov.remove(); target.style.visibility = ""; };
  }, 2000);
}

  const players = names.map((name, i) => ({ id: `h${i}`, name }));

  judgeSel = null;
  viewer = null;
  lastViewer = null;

  Sound.play("deal");
  step();

// ------------------------------------------------------------------ carte e categorie

const CUSTOM_KEY = "cah-custom";
// Categorie fisse. Bianche: chi, dove, cosa, azione, concetto. Nere: quattro temi.
const WHITE_CATS = ["Soggetti", "Luoghi", "Oggetti", "Azioni", "Concetti"];
const BLACK_CATS = ["Quotidiano", "Vita personale", "Cultura e spettacolo", "Società"];
const CAT_COLOR = {
  "Soggetti": "#c4502a", "Luoghi": "#2f6fa3", "Oggetti": "#b8862b", "Azioni": "#7a4fb0", "Concetti": "#2f8f7f",
  "Quotidiano": "#5f7d2e", "Vita personale": "#b04a7a", "Cultura e spettacolo": "#3d5a80", "Società": "#8a5a2b",
};
const KIND = { "Soggetti": "Soggetto", "Luoghi": "Luogo", "Oggetti": "Oggetto", "Azioni": "Azione", "Concetti": "Concetto" };
const ORIG_COLOR = "#9a9186";
let cardsView = { tab: "white", cat: "Tutte" };

const catsOf = (color) => (color === "b" ? BLACK_CATS : WHITE_CATS);
const validCat = (name, color) => catsOf(color).includes(name);
const defaultCat = (color) => catsOf(color)[color === "b" ? 0 : WHITE_CATS.length - 1];

function loadCustom() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(CUSTOM_KEY) || "null"); } catch { d = null; }
  d = d && typeof d === "object" ? d : {};
  const fix = (list, color) => (Array.isArray(list) ? list : [])
    .filter((c) => c && typeof c.text === "string" && c.text.trim())
    .map((c) => ({ text: c.text, cat: validCat(c.cat, color) ? c.cat : defaultCat(color) }));
  const catOverride = {};
  if (d.catOverride && typeof d.catOverride === "object") {
    for (const [id, cat] of Object.entries(d.catOverride)) if (validCat(cat, id.startsWith("b") ? "b" : "w")) catOverride[id] = cat;
  }
  return {
    white: fix(d.white, "w"),
    black: fix(d.black, "b"),
    useWhite: d.useWhite !== false,   // le mie bianche entrano nelle partite
    useBlack: d.useBlack !== false,   // le mie nere entrano nelle partite
    catOverride,
  };
}

function saveCustom(d) {
  try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(d)); }
  catch { toast("Non riesco a salvare sul telefono"); }
}

const catColor = (name) => CAT_COLOR[name] ?? ORIG_COLOR;
// Ordine in mano: Soggetti, Luoghi, Oggetti, Azioni, Concetti; le nere non finiscono in mano.
const catRank = (name) => {
  const i = WHITE_CATS.indexOf(name);
  return i >= 0 ? i : 500;
};
const handSorted = (hand) => [...hand].sort((a, b) => catRank(a.cat) - catRank(b.cat));
// Le carte scelte passano in testa alla mano, nell'ordine in cui sono state selezionate.
const handForRail = (hand) => {
  const picked = selected.map((id) => hand.find((c) => c.id === id)).filter(Boolean);
  return [...picked, ...handSorted(hand).filter((c) => !selected.includes(c.id))];
};

// Le mie carte attive per le partite (se l'interruttore è acceso).
const activeCustom = () => {
  const d = loadCustom();
  return { white: d.useWhite ? d.white : [], black: d.useBlack ? d.black : [] };
};
// Categorie scelte dall'utente per le carte ufficiali.
const withOverrides = (cards) => {
  const o = loadCustom().catOverride;
  const tag = (c) => (o[c.id] ? { ...c, cat: o[c.id] } : c);
  return { white: cards.white.map(tag), black: cards.black.map(tag) };
};
const deckFor = () => mergeCustom(withOverrides(CARDS), cfg.deck === "base" ? { white: [], black: [] } : activeCustom());

// Solo testi e categorie: il server li ripulisce di nuovo prima di usarli.
function customPayload() {
  const a = activeCustom();
  return {
    white: a.white.map((c) => ({ text: c.text, cat: c.cat })),
    black: a.black.map((c) => ({ text: c.text, cat: c.cat })),
  };
}

function allCards() {
  const d = loadCustom();
  const cat = (c) => d.catOverride[c.id] ?? c.cat;
  const orig = [
    ...CARDS.white.map((c) => ({ id: c.id, text: c.text, color: "w", cat: cat(c), mine: false })),
    ...CARDS.black.map((c) => ({ id: c.id, text: c.text, color: "b", cat: cat(c), mine: false })),
  ];
  const mine = [
    ...d.white.map((c, i) => ({ id: `m${i}`, idx: i, text: c.text, color: "w", cat: c.cat, mine: true })),
    ...d.black.map((c, i) => ({ id: `mb${i}`, idx: i, text: c.text, color: "b", cat: c.cat, mine: true })),
  ];
  return { orig, mine, d };
}

// Un'unica schermata: carte, categorie, interruttori per le proprie carte, pacchetti.
function cardsScreen() {
  game = null;
  document.body.classList.remove("in-game");
  clearTimeout(botTimer); clearTimeout(judgeTimer);
  window.scrollTo(0, 0);
  const { orig, mine, d } = allCards();
  const all = [...orig, ...mine];
  const v = cardsView;
  const color = v.tab === "black" ? "b" : "w";
  let list = v.tab === "mine" ? mine : all.filter((c) => c.color === color);
  if (v.tab !== "mine" && v.cat !== "Tutte") list = list.filter((c) => c.cat === v.cat);

  const count = (c) => all.filter((x) => x.color === c).length;
  const tabBtn = (id, label) => el("button", { type: "button", "aria-pressed": String(v.tab === id),
    onclick: () => { v.tab = id; v.cat = "Tutte"; cardsScreen(); } }, label);
  const catBtn = (name) => el("button", { type: "button", class: "chip", "aria-pressed": String(v.cat === name),
    style: `--cat:${catColor(name)}`, onclick: () => { v.cat = name; cardsScreen(); } }, name);
  const tile = (c) => {
    const held = { v: false };
    const node = el("button", { type: "button", class: `pcard ${c.color === "w" ? "w" : "b"}`,
      style: `--cat:${catColor(c.cat)}`,
      onclick: () => { if (held.v) return; showCardDetail(c, () => cardsScreen(), list); } },
      el("span", { class: "txt" }, c.text),
      el("span", { class: "tag" }, c.mine ? `${c.cat} · tua` : c.cat));
    attachHold(node, () => { held.v = true; Sound.play("flip"); cardActions(c, () => cardsScreen()); }, held);
    return node;
  };
  const toggle = (key, label) => el("button", { type: "button", class: "switch", "aria-pressed": String(d[key]),
    onclick: () => { const x = loadCustom(); x[key] = !x[key]; saveCustom(x); cardsScreen(); } },
    `${label}: ${d[key] ? "sì" : "no"}`);
  const stat = (n, label) => el("div", { class: "stat" }, el("strong", {}, String(n)), el("span", { class: "label" }, label));

  // Pacchetti: esporta le proprie carte, importa quelle ricevute.
  const packData = () => ({ formato: "cah-pacchetto", versione: 2, white: d.white, black: d.black });
  const download = () => {
    const url = URL.createObjectURL(new Blob([JSON.stringify(packData(), null, 2)], { type: "application/json" }));
    const a = el("a", { href: url, download: "cah-pacchetto.json" });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  const copy = () => {
    if (!navigator.clipboard) { toast("Copia non disponibile qui"); return; }
    navigator.clipboard.writeText(JSON.stringify(packData())).then(() => toast("Pacchetto copiato"), () => toast("Copia non riuscita"));
  };
  const pasteIn = el("textarea", { rows: "3", placeholder: "Incolla qui un pacchetto ricevuto", "aria-label": "Pacchetto da importare" });

  app.replaceChildren(el("section", { class: "cards-screen" },
    el("div", { class: "subhead" },
