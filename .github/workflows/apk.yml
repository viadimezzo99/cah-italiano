name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Copia il gioco negli asset dell'app
        run: |
          mkdir -p android/app/src/main/assets
          cp web/index.html android/app/src/main/assets/index.html

      - name: Chiave di firma fissa (dai segreti del repository)
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/android/app/release.jks"

      - name: Compila l'APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_B64 != '' && format('{0}/android/app/release.jks', github.workspace) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Nome e versione dell'APK
        id: ver
        run: |
          V=$(grep -oP "versionName '\K[^']+" android/app/build.gradle)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/debug/app-debug.apk "cah-italiano-$V.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: cah-italiano-apk
          path: cah-italiano-*.apk

      - name: Pubblica la release (l'app la legge per gli aggiornamenti)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          TAG="v$V"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG esiste già: aggiorno l'APK e tengo la stessa versione."
            gh release upload "$TAG" "cah-italiano-$V.apk" --clobber
          else
            gh release create "$TAG" "cah-italiano-$V.apk" --title "$TAG" --notes "Versione $V del gioco. Scarica l'APK e installala sopra la versione precedente."
          fi
