plugins {
    id 'com.android.application'
}

android {
    namespace 'it.cah.italiano'
    compileSdk 34

    defaultConfig {
        applicationId 'it.cah.italiano'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
